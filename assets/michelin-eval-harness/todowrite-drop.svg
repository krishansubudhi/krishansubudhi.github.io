<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="470" rx="16" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <text x="30" y="40" font-size="20" font-weight="600" fill="#222">Where Gemma's tool call went</text>

  <!-- path -->
  <rect x="30" y="70" width="170" height="70" rx="10" fill="#f3f6fb" stroke="#9fb3d1"/>
  <text x="115" y="100" font-size="14" font-weight="600" fill="#223" text-anchor="middle">Gemma 4 26B</text>
  <text x="115" y="120" font-size="12" fill="#555" text-anchor="middle">calls todowrite</text>

  <rect x="270" y="70" width="200" height="70" rx="10" fill="#fdeceb" stroke="#d9605a" stroke-width="2"/>
  <text x="370" y="100" font-size="14" font-weight="600" fill="#8a1f1a" text-anchor="middle">Ollama tool-call parser</text>
  <text x="370" y="120" font-size="12" fill="#8a1f1a" text-anchor="middle">parse fails, call dropped</text>

  <rect x="540" y="70" width="160" height="70" rx="10" fill="#f3f6fb" stroke="#9fb3d1"/>
  <text x="620" y="100" font-size="14" font-weight="600" fill="#223" text-anchor="middle">OpenCode</text>
  <text x="620" y="120" font-size="12" fill="#555" text-anchor="middle">sees no tool call</text>

  <rect x="740" y="70" width="130" height="70" rx="10" fill="#f7f7f7" stroke="#bbb"/>
  <text x="805" y="100" font-size="14" font-weight="600" fill="#333" text-anchor="middle">Session ends</text>
  <text x="805" y="120" font-size="12" fill="#555" text-anchor="middle">empty diff</text>

  <line x1="200" y1="105" x2="268" y2="105" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="470" y1="105" x2="538" y2="105" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="700" y1="105" x2="738" y2="105" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="370" y="162" font-size="12" fill="#8a1f1a" text-anchor="middle">silent: only the server log says so</text>

  <!-- bars -->
  <text x="30" y="215" font-size="16" font-weight="600" fill="#222">Resolved by the hidden SWE-bench tests, 5 tasks</text>
  <line x1="200" y1="245" x2="200" y2="420" stroke="#ccc"/>
  <text x="190" y="285" font-size="14" fill="#333" text-anchor="end">Gemma, todowrite on</text>
  <rect x="200" y="265" width="4" height="34" fill="#d9605a"/>
  <text x="214" y="288" font-size="14" fill="#333">0 of 5 resolved (empty diff on 4)</text>

  <text x="190" y="345" font-size="14" fill="#333" text-anchor="end">Gemma, todowrite off</text>
  <rect x="200" y="325" width="240" height="34" rx="3" fill="#4a8f5c"/>
  <text x="450" y="348" font-size="14" fill="#333">2 of 5 resolved</text>

  <text x="190" y="405" font-size="14" fill="#333" text-anchor="end">Qwen 3.8 27B</text>
  <rect x="200" y="385" width="480" height="34" rx="3" fill="#7a8fb3"/>
  <text x="690" y="408" font-size="14" fill="#333">4 of 5 resolved</text>

  <text x="200" y="450" font-size="12" fill="#777">One run each. Gemma's rerun had a 600 s limit; Qwen's run had 1800 s with todowrite on.</text>
</svg>
