<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-label="A closed loop in which an agent edits itself, tests pass, its score rises and it chooses its own next task, with a dashed arrow to the user's actual life that never connects.">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#6b7785"/>
    </marker>
    <marker id="ahd" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#c0392b"/>
    </marker>
  </defs>
  <style>
    .bx  { fill:#eef2f7; stroke:#c7d2de; stroke-width:1.5; }
    .out { fill:#fff6e6; stroke:#e0b96a; stroke-width:1.5; }
    .t   { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:#1f2933; }
    .lbl { font-size:15px; font-weight:600; }
    .ttl { font-size:17px; font-weight:700; }
    .cap { font-size:13px; fill:#6b7785; }
    .ar  { stroke:#6b7785; stroke-width:2; fill:none; marker-end:url(#ah); }
  </style>

  <rect x="0.5" y="0.5" width="859" height="399" rx="10" fill="#ffffff" stroke="#e2e5e9"/>
  <text class="t ttl" x="40" y="42">The loop that closes on itself</text>

  <rect class="bx" x="80"  y="98"  width="190" height="56" rx="8"/>
  <text class="t lbl" x="175" y="131" text-anchor="middle">Agent edits the agent</text>

  <rect class="bx" x="360" y="98"  width="190" height="56" rx="8"/>
  <text class="t lbl" x="455" y="131" text-anchor="middle">Tests pass</text>

  <rect class="bx" x="360" y="238" width="190" height="56" rx="8"/>
  <text class="t lbl" x="455" y="271" text-anchor="middle">Score goes up</text>

  <rect class="bx" x="80"  y="238" width="190" height="56" rx="8"/>
  <text class="t lbl" x="175" y="264" text-anchor="middle">Agent picks</text>
  <text class="t lbl" x="175" y="282" text-anchor="middle">what&#8217;s next</text>

  <path class="ar" d="M270,126 L350,126"/>
  <path class="ar" d="M455,154 L455,230"/>
  <path class="ar" d="M550,266 L470,266" />
  <path class="ar" d="M175,238 L175,162"/>

  <line x1="600" y1="60" x2="600" y2="340" stroke="#d8dee6" stroke-width="1.5" stroke-dasharray="5 5"/>

  <path d="M560,196 L648,196" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#ahd)"/>
  <circle cx="604" cy="196" r="13" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <path d="M598,190 L610,202 M610,190 L598,202" stroke="#c0392b" stroke-width="2.2"/>

  <rect class="out" x="660" y="158" width="160" height="78" rx="8"/>
  <text class="t lbl" x="740" y="188" text-anchor="middle">Your work,</text>
  <text class="t lbl" x="740" y="208" text-anchor="middle">money, time</text>
  <text class="t cap" x="740" y="226" text-anchor="middle">unchanged</text>

  <text class="t cap" x="40" y="358">Every arrow inside the loop is cheap to measure.</text>
  <text class="t cap" x="40" y="378">The only arrow that mattered was never in it.</text>
</svg>
