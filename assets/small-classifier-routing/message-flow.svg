<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .card { fill: #ffffff; }
    .box { fill: #f4f6fb; stroke: #4a5a80; stroke-width: 1.5; }
    .model { fill: #e8f0ff; stroke: #2f5bd3; stroke-width: 2; }
    .rules { fill: #fff4e5; stroke: #c27a00; stroke-width: 1.5; }
    .out { fill: #eefaf0; stroke: #2e8b47; stroke-width: 1.5; }
    .und { fill: #f3f0f7; stroke: #7a5aa6; stroke-width: 1.5; }
    .t { fill: #1d2433; font-size: 15px; }
    .s { fill: #56607a; font-size: 12px; }
    .h { fill: #1d2433; font-size: 18px; font-weight: 600; }
    .ln { stroke: #4a5a80; stroke-width: 1.6; fill: none; }
    .fb { stroke: #c27a00; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; }
    .dot { fill: #2f5bd3; }
    .dotfast { fill: #c27a00; }
    @keyframes travel { 0% { offset-distance: 0%; opacity: 0; } 5% { opacity: 1; } 90% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes pulse { 0%, 100% { stroke-width: 2; } 50% { stroke-width: 4; } }
    @keyframes dash { to { stroke-dashoffset: -22; } }
    .m1 { offset-path: path('M 110 210 L 210 210 L 300 210 L 400 210 L 560 120 L 640 85'); animation: travel 7s linear infinite; }
    .m2 { offset-path: path('M 110 210 L 210 210 L 300 210 L 400 210 L 560 210 L 640 210'); animation: travel 7s linear infinite 2.3s; opacity: 0; }
    .m3 { offset-path: path('M 110 210 L 210 210 L 255 210 L 255 345 L 640 345'); animation: travel 7s linear infinite 4.6s; opacity: 0; }
    .model { animation: pulse 3.5s ease-in-out infinite; }
    .fb { animation: dash 1.2s linear infinite; }
  </style>
  <rect class="card" x="0" y="0" width="860" height="420" rx="16"/>
  <text class="h" x="30" y="40">How one message finds who should answer</text>

  <rect class="box" x="30" y="185" width="100" height="50" rx="10"/>
  <text class="t" x="80" y="215" text-anchor="middle">message</text>

  <polygon class="box" points="255,175 305,210 255,245 205,210"/>
  <text class="t" x="255" y="214" text-anchor="middle">@tag?</text>

  <rect class="model" x="340" y="180" width="150" height="60" rx="12"/>
  <text class="t" x="415" y="207" text-anchor="middle">classifier</text>
  <text class="s" x="415" y="226" text-anchor="middle">last few turns</text>

  <rect class="rules" x="560" y="320" width="270" height="50" rx="10"/>
  <text class="t" x="695" y="350" text-anchor="middle">rules (fallback)</text>

  <rect class="out" x="640" y="62" width="190" height="42" rx="10"/>
  <text class="t" x="735" y="88" text-anchor="middle">assistant A</text>
  <rect class="out" x="640" y="118" width="190" height="42" rx="10"/>
  <text class="t" x="735" y="144" text-anchor="middle">assistant B</text>
  <rect class="out" x="640" y="190" width="190" height="42" rx="10"/>
  <text class="t" x="735" y="216" text-anchor="middle">both</text>
  <rect class="und" x="640" y="246" width="190" height="42" rx="10"/>
  <text class="t" x="735" y="272" text-anchor="middle">undecided: keep last pick</text>

  <path class="ln" d="M 130 210 L 205 210"/>
  <path class="ln" d="M 305 210 L 340 210"/>
  <text class="s" x="312" y="200">no</text>
  <path class="ln" d="M 255 245 L 255 345 L 560 345"/>
  <text class="s" x="262" y="290">yes: skip the model</text>
  <path class="ln" d="M 490 200 L 640 83"/>
  <path class="ln" d="M 490 205 L 640 139"/>
  <path class="ln" d="M 490 211 L 640 211"/>
  <path class="ln" d="M 490 220 L 640 267"/>
  <path class="fb" d="M 415 240 L 415 330 L 560 330"/>
  <text class="s" x="423" y="300">timeout or</text>
  <text class="s" x="423" y="315">garbage output</text>

  <circle class="dot m1" r="7" cx="0" cy="0"/>
  <circle class="dot m2" r="7" cx="0" cy="0"/>
  <circle class="dotfast m3" r="7" cx="0" cy="0"/>
  <text class="s" x="30" y="400">Tagged messages take the fast path. Everything else asks the classifier, and the rules catch it if the model fails.</text>
</svg>
