<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="14" fill="#6366f1"/>
  <text x="80" y="110" font-size="28" font-weight="700" fill="#6366f1" letter-spacing="3">AI AGENT BLOAT REPORT CARD</text>
  <text font-size="76" font-weight="800" fill="#0f172a">
