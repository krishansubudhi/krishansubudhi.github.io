<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-label="Two reply pipelines side by side. Version one puts a language model subprocess inside the reply path, costing five to eleven seconds and needing eight guards. Version two writes plain markdown and parses it deterministically at render time for zero cost.">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#6b7785"/></marker>
  </defs>
  <style>
    .t   { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:#1f2933; }
    .hd  { font-size:15px; font-weight:700; letter-spacing:.3px; }
    .lbl { font-size:13.5px; font-weight:600; }
    .cap { font-size:12.5px; fill:#6b7785; }
    .bx  { fill:#eef2f7; stroke:#c7d2de; stroke-width:1.4; }
    .ar  { stroke:#6b7785; stroke-width:1.8; fill:none; marker-end:url(#a1); }
  </style>

  <rect x="0.5" y="0.5" width="859" height="469" rx="10" fill="#ffffff" stroke="#e2e5e9"/>
  <line x1="430" y1="30" x2="430" y2="440" stroke="#d8dee6" stroke-width="1.5" stroke-dasharray="5 5"/>

  <text class="t hd" x="40" y="46" fill="#8f3b2e">v1 &#8212; a model inside the funnel</text>
  <rect class="bx" x="40" y="66"  width="330" height="42" rx="7"/>
  <text class="t lbl" x="205" y="92"  text-anchor="middle">head writes a reply</text>
  <path class="ar" d="M205,108 L205,132"/>

  <rect x="40" y="134" width="330" height="70" rx="7" fill="#fdecea" stroke="#d99a90" stroke-width="1.6"/>
  <text class="t lbl" x="205" y="160" text-anchor="middle" fill="#8f3b2e">a second LLM retypes the whole thing</text>
  <text class="t cap" x="205" y="180" text-anchor="middle">subprocess, sonnet, blocking the funnel</text>
  <text class="t lbl" x="205" y="197" text-anchor="middle" fill="#8f3b2e">4.7s prose &#183; 11.0s table &#183; 11.3s checklist</text>
  <path class="ar" d="M205,204 L205,228"/>

  <rect class="bx" x="40" y="230" width="330" height="60" rx="7"/>
  <text class="t lbl" x="205" y="254" text-anchor="middle">8 guards, because it can lie</text>
  <text class="t cap" x="205" y="274" text-anchor="middle">length check, token-retention check, echo check&#8230;</text>
  <path class="ar" d="M205,290 L205,314"/>

  <rect class="bx" x="40" y="316" width="330" height="42" rx="7"/>
  <text class="t lbl" x="205" y="342" text-anchor="middle">bubble, rewritten after the fact</text>

  <text class="t cap" x="40" y="392">Same reply can render differently twice.</text>
  <text class="t cap" x="40" y="412">Dropping a paragraph is a normal outcome you must detect.</text>
  <text class="t cap" x="40" y="432">Switched off in the test suite, so it was untested for weeks.</text>

  <text class="t hd" x="470" y="46" fill="#2e7d4f">v2 &#8212; a parser at render time</text>
  <rect class="bx" x="470" y="66" width="330" height="42" rx="7"/>
  <text class="t lbl" x="635" y="92" text-anchor="middle">head writes plain markdown</text>
  <path class="ar" d="M635,108 L635,132"/>

  <rect class="bx" x="470" y="134" width="330" height="42" rx="7"/>
  <text class="t lbl" x="635" y="160" text-anchor="middle">stored exactly as written</text>
  <path class="ar" d="M635,176 L635,200"/>

  <rect x="470" y="202" width="330" height="70" rx="7" fill="#eaf7ee" stroke="#8fc3a3" stroke-width="1.6"/>
  <text class="t lbl" x="635" y="228" text-anchor="middle" fill="#2e7d4f">a parser reads the markdown&#8217;s own shape</text>
  <text class="t cap" x="635" y="248" text-anchor="middle">pure function, inline in the page request</text>
  <text class="t lbl" x="635" y="265" text-anchor="middle" fill="#2e7d4f">0 ms &#183; 0 tokens &#183; 0 dollars</text>
  <path class="ar" d="M635,272 L635,314"/>

  <rect class="bx" x="470" y="316" width="330" height="42" rx="7"/>
  <text class="t lbl" x="635" y="342" text-anchor="middle">cards, tiles, tables, tappable chips</text>

  <text class="t cap" x="470" y="392">Deterministic: same input, same output, every time.</text>
  <text class="t cap" x="470" y="412">Losing a word would have to be a bug in a loop.</text>
  <text class="t cap" x="470" y="432">369 lines of pure assertions. Nothing stubbed.</text>
</svg>
