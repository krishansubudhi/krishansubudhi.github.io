<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="760" height="400" rx="14" fill="#ffffff" stroke="#d9dde3"/>
  <text x="30" y="42" font-size="20" font-weight="700" fill="#1c2430">Same four cases, with the hint and blind</text>
  <text x="30" y="66" font-size="14" fill="#55606e">Expectations passed, out of 3 or 4 per case.</text>

  <g font-size="14" font-weight="700" fill="#1c2430">
    <text x="30" y="112">Case</text>
    <text x="300" y="94" text-anchor="middle">Opus 5.5</text>
    <text x="470" y="94" text-anchor="middle">Gemini 4 Neon</text>
    <text x="640" y="94" text-anchor="middle">Gemini 4 Hydrogen</text>
  </g>
  <g font-size="12" fill="#55606e" text-anchor="middle">
    <text x="260" y="114">hint</text><text x="340" y="114">blind</text>
    <text x="430" y="114">hint</text><text x="510" y="114">blind</text>
    <text x="600" y="114">hint</text><text x="680" y="114">blind</text>
  </g>
  <line x1="30" y1="124" x2="730" y2="124" stroke="#d9dde3"/>

  <g font-size="15" fill="#1c2430">
    <text x="30" y="162">Tool is broken, find another way</text>
    <text x="30" y="222">Stuck goal, try a new way</text>
    <text x="30" y="282">Remember the pairing key</text>
    <text x="30" y="342">Remark made in passing</text>
  </g>

  <g font-size="15" text-anchor="middle" fill="#1b7f3b">
    <text x="260" y="162">3/3</text><text x="340" y="162">3/3</text>
    <text x="430" y="162">3/3</text><text x="510" y="162">3/3</text>
    <text x="600" y="162">3/3</text>
    <text x="260" y="222">3/3</text><text x="340" y="222">3/3</text>
    <text x="430" y="222">3/3</text><text x="510" y="222">3/3</text>
    <text x="600" y="222">3/3</text><text x="680" y="222">3/3</text>
    <text x="260" y="282">4/4</text><text x="430" y="282">4/4</text><text x="600" y="282">4/4</text>
    <text x="260" y="342">3/3</text><text x="340" y="342">3/3</text>
    <text x="430" y="342">3/3</text><text x="510" y="342">3/3</text>
    <text x="600" y="342">3/3</text><text x="680" y="342">3/3</text>
  </g>

  <g>
    <rect x="652" y="142" width="56" height="30" rx="6" fill="#fdecea" stroke="#e9a59f"/>
    <rect x="312" y="262" width="56" height="30" rx="6" fill="#fdecea" stroke="#e9a59f"/>
    <rect x="482" y="262" width="56" height="30" rx="6" fill="#fdecea" stroke="#e9a59f"/>
    <rect x="652" y="262" width="56" height="30" rx="6" fill="#fdecea" stroke="#e9a59f"/>
  </g>
  <g font-size="15" font-weight="700" text-anchor="middle" fill="#b3261e">
    <text x="680" y="162">1/3</text>
    <text x="340" y="282">2/4</text><text x="510" y="282">2/4</text><text x="680" y="282">2/4</text>
  </g>

  <line x1="30" y1="362" x2="730" y2="362" stroke="#d9dde3"/>
  <text x="30" y="384" font-size="13" fill="#55606e">Red: a failed case. Blind pairing key: 3 runs per model, all 2/4. Every other cell is one run.</text>
</svg>
