<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" role="img" aria-labelledby="t1 d1"><title id="t1">Before and after: who the assistant buys as</title><desc id="d1">Before: my assistant signs in as me and every card saved in my accounts is reachable; that path gets crossed out. After: a request travels from my assistant to its own email and accounts, to an agentic card capped at 500 dollars a month, waits for my tap, and only then reaches the merchant.</desc><style>
 .t{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif}
 .ttl{font-size:20px;font-weight:700;fill:#1f2933}
 .hd{font-size:13px;font-weight:700;fill:#52606d;letter-spacing:1px}
 .lbl{font-size:14.5px;font-weight:700;fill:#1f2933}
 .cap{font-size:12.5px;fill:#52606d}
 .mid{text-anchor:middle}
 .red{fill:#a8321f} .grn{fill:#2f6b45} .amb{fill:#8a6414}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker>
<marker id="ahx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d99a90"/></marker></defs><g class="t"><rect x="1" y="1" width="818" height="438" rx="14" fill="#ffffff" stroke="#e2e5e9"/><text class="ttl" x="30" y="40">Who the assistant buys as</text><text class="hd" x="30" y="80">BEFORE: SIGNED IN AS ME</text><g><animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0.000;0.120;0.200;1.000" values="1;1;0.45;0.45"/><rect x="30" y="95" width="150" height="60" rx="10" fill="#eef2f7" stroke="#9fb3c8" stroke-width="1.6"/><text class="lbl mid" x="105" y="122">My assistant</text><text class="cap mid" x="105" y="141">in my session</text><path d="M182,125 L256,125" stroke="#d99a90" stroke-width="2" fill="none" marker-end="url(#ahx)"/><rect x="260" y="95" width="190" height="60" rx="10" fill="#fdecea" stroke="#d99a90" stroke-width="1.6"/><text class="lbl mid" x="355" y="122">My accounts</text><text class="cap mid" x="355" y="141">shopping, food delivery</text><path d="M452,125 L526,125" stroke="#d99a90" stroke-width="2" fill="none" marker-end="url(#ahx)"/><rect x="530" y="88" width="260" height="74" rx="10" fill="#fdecea" stroke="#d99a90" stroke-width="1.6"/><text class="lbl mid red" x="660" y="112">Every saved card reachable</text><rect x="560" y="124" width="54" height="26" rx="4" fill="#ffffff" stroke="#d99a90"/><rect x="633" y="124" width="54" height="26" rx="4" fill="#ffffff" stroke="#d99a90"/><rect x="706" y="124" width="54" height="26" rx="4" fill="#ffffff" stroke="#d99a90"/></g><path d="M24,125 L796,125" stroke="#c0392b" stroke-width="4" stroke-linecap="round" stroke-dasharray="772" fill="none"><animate attributeName="stroke-dashoffset" dur="7s" repeatCount="indefinite" keyTimes="0.000;0.080;0.200;1.000" values="772;772;0;0"/></path><text class="lbl mid red" x="410" y="190" opacity="0"><animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0.000;0.180;0.240;1.000" values="0;0;1;1"/>Crossed out: no more borrowing my identity</text><line x1="30" y1="215" x2="790" y2="215" stroke="#e2e5e9" stroke-width="1.5"/><text class="hd" x="30" y="252">AFTER: ITS OWN IDENTITY</text><rect x="30" y="275" width="120" height="70" rx="10" fill="#eef2f7" stroke="#9fb3c8" stroke-width="1.6"/><text class="lbl mid" x="90.0" y="304">My assistant</text><text class="cap mid" x="90.0" y="324">its own browser</text><path d="M152,310 L180,310" stroke="#7b8794" stroke-width="2" fill="none" marker-end="url(#ah)"/><rect x="184" y="275" width="140" height="70" rx="10" fill="#e6f4ea" stroke="#6fae85" stroke-width="1.6"/><text class="lbl mid" x="254.0" y="304">Its own email</text><text class="cap mid" x="254.0" y="324">and accounts</text><path d="M326,310 L354,310" stroke="#7b8794" stroke-width="2" fill="none" marker-end="url(#ah)"/><rect x="358" y="275" width="132" height="70" rx="10" fill="#e6f4ea" stroke="#6fae85" stroke-width="1.6"/><text class="lbl mid" x="424.0" y="304">Agentic card</text><text class="cap mid" x="424.0" y="324">$500 / month cap</text><path d="M492,310 L520,310" stroke="#7b8794" stroke-width="2" fill="none" marker-end="url(#ah)"/><rect x="524" y="275" width="124" height="70" rx="10" fill="#fff4d6" stroke="#d9b45a" stroke-width="1.6"/><text class="lbl mid" x="586.0" y="304">Your tap</text><text class="cap mid" x="586.0" y="324">every charge</text><path d="M650,310 L678,310" stroke="#7b8794" stroke-width="2" fill="none" marker-end="url(#ah)"/><rect x="682" y="275" width="108" height="70" rx="10" fill="#eef2f7" stroke="#9fb3c8" stroke-width="1.6"/><text class="lbl mid" x="736.0" y="314">Merchant</text><rect x="524" y="275" width="124" height="70" rx="10" fill="none" stroke="#d9a520" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0.000;0.500;0.530;0.580;0.620;0.670;0.710;0.740;1.000" values="0;0;1;0.2;1;0.2;1;0;0"/><animate attributeName="stroke-width" dur="7s" repeatCount="indefinite" keyTimes="0.000;0.500;0.600;0.740;1.000" values="3;3;9;3;3"/></rect><rect x="682" y="275" width="108" height="70" rx="10" fill="#e6f4ea" stroke="#6fae85" stroke-width="2" opacity="0"><animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0.000;0.820;0.860;0.970;1.000" values="0;0;1;1;0"/></rect><text class="lbl mid grn" x="736" y="314" opacity="0"><animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0.000;0.820;0.860;0.970;1.000" values="0;0;1;1;0"/>Paid &#10003;</text><circle cy="362" r="8" fill="#2f6fd6" stroke="#ffffff" stroke-width="2" opacity="0"><animate attributeName="cx" dur="7s" repeatCount="indefinite" keyTimes="0.000;0.220;0.320;0.400;0.460;0.500;0.540;0.760;0.840;1.000" values="90;90;254;254;424;424;586;586;736;736"/><animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0.000;0.200;0.220;0.840;0.880;1.000" values="0;0;1;1;0;0"/></circle><text class="lbl mid grn" x="410" y="395">Worst case: one charge I approved myself</text></g></svg>