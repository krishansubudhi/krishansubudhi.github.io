<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" role="img" aria-labelledby="t1 d1"><title id="t1">Four tries to order lunch</title><desc id="d1">Each attempt lights up in turn. One, my browser: the extension was closed. Two, my Uber account: email code, SMS code, and my other saved cards are in it. Three, its own Uber account: no phone number. Each of these turns grey with an X. Four, the restaurant's own site with guest checkout: the first payment is declined, I tap approve in my card app, and the order is placed for about 13 dollars, shown in green.</desc><style>
 .t{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif}
 .ttl{font-size:20px;font-weight:700;fill:#1f2933}
 .hd{font-size:13px;font-weight:700;fill:#52606d;letter-spacing:1px}
 .lbl{font-size:14.5px;font-weight:700;fill:#1f2933}
 .cap{font-size:12.5px;fill:#52606d}
 .mid{text-anchor:middle}
 .red{fill:#a8321f} .grn{fill:#2f6b45} .amb{fill:#8a6414}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker>
<marker id="ahx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d99a90"/></marker></defs><g class="t"><rect x="1" y="1" width="818" height="518" rx="14" fill="#ffffff" stroke="#e2e5e9"/><text class="ttl" x="30" y="40">Four tries to order lunch</text><line x1="60" y1="80" x2="60" y2="470" stroke="#cbd2d9" stroke-width="3"/><circle cx="60" cy="95" r="14" fill="#9aa5b1"/><text class="lbl mid" x="60" y="100" fill="#ffffff" style="fill:#fff">1</text><rect x="95" y="70" width="695" height="56" rx="10" stroke-width="1.6" fill="#f5f7fa" stroke="#cbd2d9"><animate attributeName="fill" dur="8s" repeatCount="indefinite" keyTimes="0.000;0.030;0.040;0.130;0.140;0.980;1.000" values="#f5f7fa;#f5f7fa;#fff4d6;#fff4d6;#eceff2;#eceff2;#f5f7fa"/><animate attributeName="stroke" dur="8s" repeatCount="indefinite" keyTimes="0.000;0.030;0.040;0.130;0.140;0.980;1.000" values="#cbd2d9;#cbd2d9;#d9b45a;#d9b45a;#b8c0c8;#b8c0c8;#cbd2d9"/></rect><text class="lbl" x="112" y="93">My browser, through the extension</text><text class="cap" x="112" y="114">The side panel was closed, so my signed-in account was out of reach.</text><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0.000;0.130;0.140;0.980;1.000" values="0;0;1;1;0"/><text class="lbl red" x="740" y="93" text-anchor="end">CLOSED</text><path d="M752,84 l20,20 M772,84 l-20,20" stroke="#a8321f" stroke-width="3" stroke-linecap="round"/></g><circle cx="60" cy="170" r="14" fill="#9aa5b1"/><text class="lbl mid" x="60" y="175" fill="#ffffff" style="fill:#fff">2</text><rect x="95" y="145" width="695" height="56" rx="10" stroke-width="1.6" fill="#f5f7fa" stroke="#cbd2d9"><animate attributeName="fill" dur="8s" repeatCount="indefinite" keyTimes="0.000;0.160;0.170;0.260;0.270;0.980;1.000" values="#f5f7fa;#f5f7fa;#fff4d6;#fff4d6;#eceff2;#eceff2;#f5f7fa"/><animate attributeName="stroke" dur="8s" repeatCount="indefinite" keyTimes="0.000;0.160;0.170;0.260;0.270;0.980;1.000" values="#cbd2d9;#cbd2d9;#d9b45a;#d9b45a;#b8c0c8;#b8c0c8;#cbd2d9"/></rect><text class="lbl" x="112" y="168">My Uber account</text><text class="cap" x="112" y="189">Email code, then SMS code. And my other saved cards live there. Unsafe.</text><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0.000;0.260;0.270;0.980;1.000" values="0;0;1;1;0"/><text class="lbl red" x="740" y="168" text-anchor="end">REFUSED</text><path d="M752,159 l20,20 M772,159 l-20,20" stroke="#a8321f" stroke-width="3" stroke-linecap="round"/></g><circle cx="60" cy="245" r="14" fill="#9aa5b1"/><text class="lbl mid" x="60" y="250" fill="#ffffff" style="fill:#fff">3</text><rect x="95" y="220" width="695" height="56" rx="10" stroke-width="1.6" fill="#f5f7fa" stroke="#cbd2d9"><animate attributeName="fill" dur="8s" repeatCount="indefinite" keyTimes="0.000;0.290;0.300;0.390;0.400;0.980;1.000" values="#f5f7fa;#f5f7fa;#fff4d6;#fff4d6;#eceff2;#eceff2;#f5f7fa"/><animate attributeName="stroke" dur="8s" repeatCount="indefinite" keyTimes="0.000;0.290;0.300;0.390;0.400;0.980;1.000" values="#cbd2d9;#cbd2d9;#d9b45a;#d9b45a;#b8c0c8;#b8c0c8;#cbd2d9"/></rect><text class="lbl" x="112" y="243">Its own Uber account</text><text class="cap" x="112" y="264">Needs a phone number. Virtual numbers don't get the login codes.</text><g opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0.000;0.390;0.400;0.980;1.000" values="0;0;1;1;0"/><text class="lbl red" x="740" y="243" text-anchor="end">PHONE WALL</text><path d="M752,234 l20,20 M772,234 l-20,20" stroke="#a8321f" stroke-width="3" stroke-linecap="round"/></g><text class="cap" x="95" y="303" font-style="italic" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0.000;0.420;0.440;0.980;1.000" values="0;0;1;1;0"/>"I can't." I pushed back: restaurants have websites too.</text><circle cx="60" cy="345" r="14" fill="#9aa5b1"/><text class="lbl mid" x="60" y="350" style="fill:#fff">4</text><rect x="95" y="320" width="695" height="150" rx="10" stroke-width="1.6" fill="#f5f7fa" stroke="#cbd2d9"><animate attributeName="fill" dur="8s" repeatCount="indefinite" keyTimes="0.000;0.500;0.510;0.800;0.810;0.980;1.000" values="#f5f7fa;#f5f7fa;#fff4d6;#fff4d6;#e6f4ea;#e6f4ea;#f5f7fa"/><animate attributeName="stroke" dur="8s" repeatCount="indefinite" keyTimes="0.000;0.500;0.510;0.800;0.810;0.980;1.000" values="#cbd2d9;#cbd2d9;#d9b45a;#d9b45a;#6fae85;#6fae85;#cbd2d9"/></rect><text class="lbl" x="112" y="343">The restaurant's own site: guest checkout, pickup</text><text class="cap" x="112" y="364">Receipt to the assistant's own email. Paid with the agentic card.</text><rect x="112" y="380" width="200" height="70" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.6"/><g opacity="0.25"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0.000;0.580;0.590;0.980;1.000" values="0.25;0.25;1;1;0.25"/><rect x="112" y="380" width="200" height="70" rx="8" fill="#fdecea" stroke="#d99a90" stroke-width="1.6"/><text class="lbl mid red" x="212" y="408">Declined</text><text class="cap mid" x="212" y="430">waiting for approval</text></g><rect x="342" y="380" width="200" height="70" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.6"/><g opacity="0.25"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0.000;0.680;0.690;0.980;1.000" values="0.25;0.25;1;1;0.25"/><rect x="342" y="380" width="200" height="70" rx="8" fill="#fff4d6" stroke="#d9b45a" stroke-width="1.6"/><text class="lbl mid amb" x="442" y="408">I tap approve</text><text class="cap mid" x="442" y="430">in the card app</text></g><rect x="572" y="380" width="200" height="70" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="1.6"/><g opacity="0.25"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0.000;0.800;0.810;0.980;1.000" values="0.25;0.25;1;1;0.25"/><rect x="572" y="380" width="200" height="70" rx="8" fill="#e6f4ea" stroke="#6fae85" stroke-width="1.6"/><text class="lbl mid grn" x="672" y="408">Order placed</text><text class="cap mid" x="672" y="430">card re-entered, ~$13</text></g><path d="M314,415 L338,415" stroke="#7b8794" stroke-width="2" marker-end="url(#ah)"/><path d="M544,415 L568,415" stroke="#7b8794" stroke-width="2" marker-end="url(#ah)"/><rect x="342" y="380" width="200" height="70" rx="8" fill="none" stroke="#d9a520" stroke-width="3" opacity="0"><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0.000;0.680;0.700;0.730;0.760;0.790;1.000" values="0;0;1;0.2;1;0;0"/></rect></g></svg>