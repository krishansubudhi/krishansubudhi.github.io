<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="860" height="460" role="img" aria-label="A four-step loop. You write the intent and the constraints. The agent implements. An automated gate checks the work, and anything that fails goes straight back to the agent without costing you any time. Only what survives the gate reaches you, and you review those exceptions and update the intent. A note points at the gate: the agent can run these rules but cannot edit them.">
  <style>
    .t   { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; fill:#1f2933; }
    .ttl { font-size:17px; font-weight:700; }
    .hd  { font-size:14.5px; font-weight:700; }
    .cap { font-size:12.5px; fill:#6b7785; }
    .arw { font-size:12.5px; fill:#6b7785; font-weight:600; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a929c"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="859" height="459" rx="10" fill="#ffffff" stroke="#e2e5e9"/>
  <text class="t ttl" x="40" y="40">Where the human actually stands</text>

  <rect x="46" y="86" width="250" height="96" rx="10" fill="#eef3fd" stroke="#5b8def" stroke-width="1.6"/>
  <text class="t hd"  x="66" y="116">You: intent and constraints</text>
  <text class="t cap" x="66" y="138">what it must do, what it must</text>
  <text class="t cap" x="66" y="156">never do, how we will know</text>

  <rect x="564" y="86" width="250" height="96" rx="10" fill="#f7f8fa" stroke="#b9c2cd" stroke-width="1.6"/>
  <text class="t hd"  x="584" y="116">Agent: implements</text>
  <text class="t cap" x="584" y="138">the typing, the plumbing, the</text>
  <text class="t cap" x="584" y="156">tests, the third attempt</text>

  <rect x="564" y="262" width="250" height="96" rx="10" fill="#fdf6ea" stroke="#d98b2b" stroke-width="1.6"/>
  <text class="t hd"  x="584" y="292">Gate: automated checks</text>
  <text class="t cap" x="584" y="314">runs every time, cannot be</text>
  <text class="t cap" x="584" y="332">argued with, cannot be skipped</text>

  <rect x="46" y="262" width="250" height="96" rx="10" fill="#eef3fd" stroke="#5b8def" stroke-width="1.6"/>
  <text class="t hd"  x="66" y="292">You: review the exceptions</text>
  <text class="t cap" x="66" y="314">the design calls and the things</text>
  <text class="t cap" x="66" y="332">no check could ever encode</text>

  <line x1="300" y1="134" x2="558" y2="134" stroke="#8a929c" stroke-width="2" marker-end="url(#a)"/>
  <text class="t arw" x="429" y="124" text-anchor="middle">hand it the work</text>

  <line x1="689" y1="186" x2="689" y2="256" stroke="#8a929c" stroke-width="2" marker-end="url(#a)"/>
  <text class="t arw" x="701" y="226">submit</text>

  <line x1="558" y1="310" x2="302" y2="310" stroke="#8a929c" stroke-width="2" marker-end="url(#a)"/>
  <text class="t arw" x="430" y="300" text-anchor="middle">only what passed</text>

  <line x1="171" y1="256" x2="171" y2="188" stroke="#8a929c" stroke-width="2" marker-end="url(#a)"/>
  <text class="t arw" x="183" y="226">update the intent</text>

  <path d="M814,300 C 838,300 838,148 820,148" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#r)"/>

  <line x1="330" y1="208" x2="366" y2="208" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="t arw" x="378" y="212" fill="#a03027">fails the gate &#8212; straight back to the</text>
  <text class="t arw" x="378" y="230" fill="#a03027">agent, and it costs you nothing</text>

  <rect x="46" y="384" width="768" height="58" rx="9" fill="#fdf6ea" stroke="#eadfc9"/>
  <text class="t cap" x="66" y="408">The gate is what makes the loop safe to leave alone: the agent can run the rules, and cannot edit them.</text>
  <text class="t cap" x="66" y="428">The moment it can weaken a check in order to get past it, it is not a gate. It is a suggestion.</text>
</svg>
