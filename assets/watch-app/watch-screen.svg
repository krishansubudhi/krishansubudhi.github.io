<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="wa3t wa3d">
  <title id="wa3t">The watch app's two main screens</title>
  <desc id="wa3d">Two round Pixel Watch faces. Left, listening: a large gold orb with a mic in the middle, glowing rings around it, the word Listening, and a small red cross to discard the recording. Right, the reply: the answer text in white on black, with a small gold replay button and a gold mic button below it.</desc>
  <defs>
    <radialGradient id="orb" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffe9a3"/><stop offset="0.55" stop-color="#f2c94c"/><stop offset="1" stop-color="#b8901f"/></radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0.45" stop-color="#f2c94c" stop-opacity="0.35"/><stop offset="1" stop-color="#f2c94c" stop-opacity="0"/></radialGradient>
    <linearGradient id="bez" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9dde2"/><stop offset="0.5" stop-color="#8e959d"/><stop offset="1" stop-color="#c8cdd3"/></linearGradient>
    <g id="mic"><rect x="-11" y="-24" width="22" height="34" rx="11"/><path d="M-19 0 a19 19 0 0 0 38 0" fill="none" stroke-width="5" stroke-linecap="round"/><path d="M0 19 L0 28" stroke-width="5" stroke-linecap="round"/></g>
  </defs>
  <style>text{font-family:"Google Sans",Roboto,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}</style>

  <!-- left watch: listening -->
  <g transform="translate(190 200)">
    <rect x="-62" y="-205" width="124" height="60" rx="14" fill="#3a3f45"/>
    <rect x="-62" y="145" width="124" height="60" rx="14" fill="#3a3f45"/>
    <circle r="168" fill="url(#bez)"/>
    <circle r="158" fill="#000"/>
    <rect x="164" y="-22" width="14" height="44" rx="5" fill="#8e959d"/>
    <text y="-110" text-anchor="middle" font-size="20" fill="#bfc5cc">10:42</text>
    <circle r="96" fill="url(#glow)"/>
    <circle r="74" fill="none" stroke="#f2c94c" stroke-opacity="0.35" stroke-width="3"/>
    <circle r="56" fill="url(#orb)"/>
    <use href="#mic" fill="#1b1f24" stroke="#1b1f24" transform="translate(0 -2)"/>
    <text y="104" text-anchor="middle" font-size="22" fill="#f2c94c">Listening…</text>
    <circle cx="0" cy="134" r="0"/>
    <g transform="translate(92 -78)"><circle r="17" fill="#d64545"/><path d="M-6 -6 L6 6 M6 -6 L-6 6" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/></g>
  </g>

  <!-- right watch: reply -->
  <g transform="translate(570 200)">
    <rect x="-62" y="-205" width="124" height="60" rx="14" fill="#3a3f45"/>
    <rect x="-62" y="145" width="124" height="60" rx="14" fill="#3a3f45"/>
    <circle r="168" fill="url(#bez)"/>
    <circle r="158" fill="#000"/>
    <rect x="164" y="-22" width="14" height="44" rx="5" fill="#8e959d"/>
    <text y="-110" text-anchor="middle" font-size="20" fill="#bfc5cc">10:43</text>
    <text text-anchor="middle" font-size="24" fill="#ffffff">
      <tspan x="0" y="-62">Your 3pm moved</tspan>
      <tspan x="0" y="-30">to 4pm. Want a</tspan>
      <tspan x="0" y="2">reminder at 3:45?</tspan>
    </text>
    <g transform="translate(-44 72)"><circle r="26" fill="#2a2a22" stroke="#f2c94c" stroke-width="2.5"/><path d="M-9 -9 a13 13 0 1 1 -4 10" fill="none" stroke="#f2c94c" stroke-width="3.4" stroke-linecap="round"/><path d="M-15 -14 L-9 -9 L-15 -3" fill="none" stroke="#f2c94c" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g transform="translate(44 72)"><circle r="30" fill="url(#orb)"/><use href="#mic" fill="#1b1f24" stroke="#1b1f24" transform="translate(0 -1) scale(0.58)"/></g>
    <text y="128" text-anchor="middle" font-size="16" fill="#8e959d">replay · ask</text>
  </g>
</svg>
