<script>
// Gentle sounds via WebAudio, with a mute toggle shared by every game.
const SFX=(function(){let ac=null,muted=false;try{muted=localStorage.getItem('games.muted')==='1';}catch(e){}
const btn=document.getElementById('mute');function paint(){if(btn){btn.textContent=muted?'🔇':'🔊';btn.setAttribute('aria-pressed',muted?'true':'false');}}paint();
function tone(f,d,type,vol,slide){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
 const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
 g.gain.setValueAtTime(vol||0.06,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+0.02);}catch(e){}}
function notes(list,step,type){list.forEach((f,i)=>setTimeout(()=>tone(f,step*1.4,type),i*step*1000));}
if(btn)btn.addEventListener('click',()=>{muted=!muted;try{localStorage.setItem('games.muted',muted?'1':'0');}catch(e){}paint();if(muted&&window.speechSynthesis)try{speechSynthesis.cancel();}catch(e){}tone(660,0.08);});
return{tone,notes,get muted(){return muted;}};})();
</script>
<script>
(function(){
const area=document.getElementById('area'),c=document.getElementById('g'),x=c.getContext('2d'),S=document.getElementById('s'),B=document.getElementById('b'),CN=document.getElementById('cn');
const KEY='games.dinohw.best';
let best=0;try{best=parseInt(localStorage.getItem(KEY),10)||0;}catch(e){}B.textContent=best;
// Logical space is 360 wide; height flexes with the area (between a phone-landscape floor and a tall-portrait cap).
const W0=360,HFLOOR=240,MIN_AR=W0/470,MAX_AR=W0/HFLOOR;
let W=W0,H=470,G=400,scaleF=1,stars=[];
const FONT='Georgia,"Times New Roman",serif';
const STAND={w:26,h:34},DUCKD={w:36,h:20};
let d,obs,candy,pops,sc,tt,speed,score,nCandy,state='ready',nextD,shake,overAt,duckHeld,duckUntil,newBest;
function size(){
 const R=Math.min(3,window.devicePixelRatio||1);
 let w=Math.max(1,area.clientWidth),h=Math.max(1,area.clientHeight);
 const ar=w/h;
 if(ar<MIN_AR){h=w/MIN_AR;scaleF=w/W0;W=W0;H=h/scaleF;}
 else if(ar>MAX_AR){H=HFLOOR;scaleF=h/H;W=w/scaleF;}
 else{scaleF=w/W0;W=W0;H=h/scaleF;}
 G=H-(H<300?44:70);
 c.style.width=Math.round(w)+'px';c.style.height=Math.round(h)+'px';
 c.width=Math.round(w*R);c.height=Math.round(h*R);
 x.setTransform(scaleF*R,0,0,scaleF*R,0,0);
 stars=[];let s=7;for(let i=0;i<46;i++){s=(s*9301+49297)%233280;const a=s/233280;s=(s*9301+49297)%233280;const b=s/233280;stars.push({x:a*W,y:b*G*0.7,r:0.5+(i%3)*0.4,p:i*1.7});}
 if(d&&d.f>G)d.f=G;
}
function reset(){d={x:48,f:G,vy:0};obs=[];candy=[];pops=[];sc=0;speed=4.2;score=0;nCandy=0;nextD=260;shake=0;duckHeld=false;duckUntil=0;newBest=false;CN.textContent='0';S.textContent='0';}
size();reset();
const ground=()=>d.f>=G-0.01;

function jump(){if(state==='run'&&ground()){d.vy=-10.6;SFX.tone(420,0.16,'square',0.035,780);}}
function begin(){reset();state='run';SFX.notes([330,440,523],0.07,'triangle');}

let ptr=null;
area.addEventListener('pointerdown',e=>{e.preventDefault();
 if(e.pointerType==='mouse'){act();return;}
 ptr={id:e.pointerId,x:e.clientX,y:e.clientY,swiped:false};try{area.setPointerCapture(e.pointerId);}catch(_){}});
area.addEventListener('pointermove',e=>{if(!ptr||e.pointerId!==ptr.id||ptr.swiped)return;const dx=e.clientX-ptr.x,dy=e.clientY-ptr.y;
 if(dy>18&&dy>Math.abs(dx)){ptr.swiped=true;duck(true);}else if(dy<-30&&-dy>Math.abs(dx)){ptr.swiped=true;act();}});
function release(e){if(!ptr||e.pointerId!==ptr.id)return;const p=ptr;ptr=null;if(p.swiped)duck(false);else if(e.type==='pointerup')act();}
area.addEventListener('pointerup',release);area.addEventListener('pointercancel',release);
area.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
area.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('a,#mute'))return;
 if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();if(!e.repeat)act();}
 else if(e.code==='ArrowDown'||e.code==='KeyS'){e.preventDefault();duck(true);}});
addEventListener('keyup',e=>{if(e.code==='ArrowDown'||e.code==='KeyS')duck(false);});
addEventListener('resize',size);addEventListener('orientationchange',size);
function spawn(){
 const r=Math.random(),X=W+30;let width;
 if(score>120&&r<0.3){obs.push({t:'bat',x:X,y:G-40,w:30,h:16,in:4,ph:Math.random()*6});width=30;}
 else if(r<0.62){const n=Math.random()<0.25?2:1;for(let i=0;i<n;i++)obs.push({t:'pump',x:X+i*28,y:G-22,w:26,h:22,in:3});width=26+(n-1)*28;}
 else{const n=Math.random()<0.3?2:1;for(let i=0;i<n;i++){const hh=i?30:(Math.random()<0.5?30:38);obs.push({t:'tomb',x:X+i*26,y:G-hh,w:22,h:hh,in:3});}width=22+(n-1)*26;}
 const gap=speed*34+70+Math.random()*speed*20;
 if(Math.random()<0.6){const hi=Math.random()<0.4,mx=X-gap*0.45;for(let i=0;i<3;i++)candy.push({x:mx+(i-1)*24,y:hi?G-86-(i==1?8:0):G-30,ph:i});}

}
function hit(a,b,ai,bi){return a.x+ai<b.x+b.w-bi&&a.x+a.w-ai>b.x+bi&&a.y+ai<b.y+b.h-bi&&a.y+a.h-ai>b.y+bi;}
function die(){state='over';overAt=performance.now();shake=16;duckHeld=false;SFX.notes([392,311,233,174],0.11,'sawtooth');
 const sc2=Math.floor(score);newBest=sc2>best;if(newBest){best=sc2;B.textContent=best;try{localStorage.setItem(KEY,String(best));}catch(e){}}}
function update(dt){
 tt+=dt;
 if(state!=='run'){if(shake>0)shake-=dt;return;}

 const g=(duckHeld&&!ground())?1.5:0.58;d.vy+=g*dt;d.f=Math.min(G,d.f+d.vy*dt);if(d.f>=G)d.vy=0;
 nextD-=speed*dt;if(nextD<=0)spawn();
 const D=ducking()?DUCKD:STAND,box={x:d.x,y:d.f-D.h,w:D.w,h:D.h};

 for(const k of candy){k.x-=speed*dt;if(!k.got&&Math.abs(k.x-(box.x+box.w/2))<14&&Math.abs(k.y-(box.y+box.h/2))<(box.h/2+9)){k.got=true;score+=50;nCandy++;CN.textContent=nCandy;pops.push({x:k.x,y:k.y,l:0});SFX.tone(880,0.1,'sine',0.05,1320);}}
 candy=candy.filter(k=>!k.got&&k.x>-20);
 for(const p of pops){p.l+=dt;}pops=pops.filter(p=>p.l<40);

}
function rr(px,py,w,h,r){x.beginPath();if(x.roundRect)x.roundRect(px,py,w,h,r);else x.rect(px,py,w,h);x.fill();}
function bat(cx,cy,s,f,eyes){const w=Math.sin(f);x.fillStyle='#07040f';x.beginPath();
 for(const q of[-1,1]){x.moveTo(cx+q*2*s,cy-s);x.quadraticCurveTo(cx+q*9*s,cy-9*s*w-4*s,cx+q*17*s,cy-8*s*w);x.quadraticCurveTo(cx+q*13*s,cy+s,cx+q*10*s,cy+2*s);x.quadraticCurveTo(cx+q*7*s,cy+s,cx+q*5*s,cy+4*s);x.lineTo(cx+q*2*s,cy+4*s);}
 x.fill();x.beginPath();x.ellipse(cx,cy+s,3.6*s,5*s,0,0,7);x.moveTo(cx-3*s,cy-3*s);x.lineTo(cx-2*s,cy-8*s);x.lineTo(cx,cy-4*s);x.lineTo(cx+2*s,cy-8*s);x.lineTo(cx+3*s,cy-3*s);x.fill();
 if(eyes){x.fillStyle='#ff3b3b';x.fillRect(cx-2.2*s,cy-s,1.6*s,1.6*s);x.fillRect(cx+.6*s,cy-s,1.6*s,1.6*s);}}
function fog(cx,cy,rx,a){x.save();x.translate(cx,cy);x.scale(1,0.22);const gr=x.createRadialGradient(0,0,0,0,0,rx);gr.addColorStop(0,'rgba(190,180,225,'+a+')');gr.addColorStop(1,'rgba(190,180,225,0)');x.fillStyle=gr;x.beginPath();x.arc(0,0,rx,0,7);x.fill();x.restore();}
const DEC=[[20,'tree'],[90,'tomb'],[150,'cross'],[230,'tomb'],[300,'tree'],[380,'fence'],[470,'cross'],[540,'tomb'],[610,'tree'],[690,'cross']],SPAN=760;
function decor(k,base,col,par){x.fillStyle=col;x.strokeStyle=col;x.lineWidth=2;
 for(let rep=-1;rep<Math.ceil(W/SPAN)+1;rep++)for(const[ox,t]of DEC){const px=ox+rep*SPAN-((sc*par)%SPAN);if(px<-60||px>W+60)continue;
  if(t==='tree'){x.lineWidth=3;x.beginPath();x.moveTo(px,base);x.lineTo(px+1,base-52);x.moveTo(px+1,base-34);x.lineTo(px-14,base-52);x.moveTo(px+1,base-24);x.lineTo(px+15,base-44);x.moveTo(px-8,base-43);x.lineTo(px-9,base-58);x.stroke();x.lineWidth=2;}
  else if(t==='tomb'){rr(px-9,base-26,18,26,[9,9,0,0]);}
  else if(t==='cross'){x.fillRect(px-2,base-34,4,34);x.fillRect(px-9,base-26,18,4);}
  else{for(let i=0;i<6;i++){x.fillRect(px+i*9,base-22,3,22);x.beginPath();x.moveTo(px+i*9-1,base-22);x.lineTo(px+i*9+1.5,base-28);x.lineTo(px+i*9+4,base-22);x.fill();}x.fillRect(px,base-14,52,2);}}}
function dino(X,F,duck,run,dead){x.save();x.translate(X,F-(duck?DUCKD.h:STAND.h));
 const G1=dead?'#7a9a74':'#4fcf5b',G2=dead?'#9db598':'#8be38a',leg=run&&!duck?Math.floor(tt/5)%2:0;
 x.fillStyle=G1;
 if(!duck){x.beginPath();x.moveTo(3,18);x.lineTo(-9,27);x.lineTo(4,26);x.fill();rr(2,14,19,17,6);x.fillStyle=G2;rr(9,20,10,9,4);x.fillStyle=G1;rr(12,4,16,14,5);rr(18,18,5,3,1);
  rr(5,29,6,5-(leg?2:0),2);rr(14,29,6,5-(leg?0:2),2);}
 else{x.beginPath();x.moveTo(5,10);x.lineTo(-7,15);x.lineTo(6,16);x.fill();rr(3,6,25,13,6);x.fillStyle=G2;rr(10,12,14,6,3);x.fillStyle=G1;rr(22,1,14,12,5);
  rr(7,16,6,4-(leg?1:0),2);rr(19,16,6,4-(leg?0:1),2);}
 const hx=duck?29:20,hy=duck?7:10;
 x.fillStyle='#fff';x.beginPath();x.arc(hx+3,hy-1,3,0,7);x.fill();x.fillStyle='#1a1226';x.beginPath();x.arc(hx+4,hy-1,1.4,0,7);x.fill();
 if(dead){x.strokeStyle='#1a1226';x.lineWidth=1.4;x.beginPath();x.moveTo(hx+1,hy-3);x.lineTo(hx+5,hy+1);x.moveTo(hx+5,hy-3);x.lineTo(hx+1,hy+1);x.stroke();}
 const hb=duck?3:6;
 x.save();x.translate(hx-1,hb);if(duck)x.rotate(-0.25);x.fillStyle='#5a2a92';x.beginPath();x.moveTo(-9,2);x.quadraticCurveTo(-3,-10,2,-12);x.quadraticCurveTo(6,-16,11,-17);x.quadraticCurveTo(7,-9,12,2);x.fill();
 x.fillStyle='#ffc933';x.fillRect(-5,-3,14,3);x.fillStyle='#3d1a69';x.beginPath();x.ellipse(2,2,15,3,0,0,7);x.fill();x.restore();
 x.restore();}
function pump(o){const cx=o.x+13,cy=o.y+12;x.fillStyle='rgba(255,140,30,0.14)';x.beginPath();x.arc(cx,cy,24,0,7);x.fill();
 x.fillStyle='#ff7a1a';x.beginPath();x.ellipse(cx,cy,13,10.5,0,0,7);x.fill();x.fillStyle='#e0600b';x.beginPath();x.ellipse(cx-6,cy,4,10,0,0,7);x.ellipse(cx+6,cy,4,10,0,0,7);x.fill();x.fillStyle='#ff9a3d';x.beginPath();x.ellipse(cx,cy,5,10.5,0,0,7);x.fill();
 x.fillStyle='#3a7a2a';x.fillRect(cx-1.5,o.y-3,4,5);
 x.fillStyle='#ffe066';x.beginPath();x.moveTo(cx-6,cy-3);x.lineTo(cx-2,cy-3);x.lineTo(cx-4,cy-7);x.moveTo(cx+2,cy-3);x.lineTo(cx+6,cy-3);x.lineTo(cx+4,cy-7);x.fill();
 x.beginPath();x.moveTo(cx-7,cy+2);x.lineTo(cx-4,cy+5);x.lineTo(cx-2,cy+2);x.lineTo(cx,cy+5);x.lineTo(cx+2,cy+2);x.lineTo(cx+4,cy+5);x.lineTo(cx+7,cy+2);x.lineTo(cx+5,cy+7);x.lineTo(cx-5,cy+7);x.fill();}

 x.fillStyle='#3f6b3a';x.fillRect(o.x,o.y+o.h-5,o.w,2);x.fillRect(o.x+2,o.y+o.h-8,5,3);}
function candyc(k){const y=k.y+Math.sin(tt*0.1+k.ph)*2.5,cx=k.x;x.save();x.translate(cx,y);x.fillStyle='#ffd23f';x.beginPath();x.moveTo(-6,5);x.lineTo(6,5);x.lineTo(4,-1);x.lineTo(-4,-1);x.fill();
 x.fillStyle='#ff8a1f';x.beginPath();x.moveTo(-4,-1);x.lineTo(4,-1);x.lineTo(2,-5);x.lineTo(-2,-5);x.fill();x.fillStyle='#fff';x.beginPath();x.moveTo(-2,-5);x.lineTo(2,-5);x.lineTo(0,-8);x.fill();x.restore();}
function draw(){
 x.save();if(shake>0)x.translate((Math.random()-.5)*shake*0.7,(Math.random()-.5)*shake*0.7);
 const sky=x.createLinearGradient(0,0,0,G);sky.addColorStop(0,'#0b0620');sky.addColorStop(0.6,'#25123f');sky.addColorStop(1,'#4a2152');x.fillStyle=sky;x.fillRect(-10,-10,W+20,H+20);
 for(const s of stars){x.globalAlpha=0.45+0.5*Math.sin(tt*0.04+s.p);x.fillStyle='#fff';x.fillRect(s.x,s.y,s.r,s.r);}x.globalAlpha=1;
 const mr=Math.min(38,H*0.12),mx=W*0.72,my=Math.min(H*0.2,G*0.32);
 const mg=x.createRadialGradient(mx,my,mr*0.8,mx,my,mr*3.2);mg.addColorStop(0,'rgba(255,238,170,0.35)');mg.addColorStop(1,'rgba(255,238,170,0)');x.fillStyle=mg;x.beginPath();x.arc(mx,my,mr*3.2,0,7);x.fill();
 x.fillStyle='#fff3c4';x.beginPath();x.arc(mx,my,mr,0,7);x.fill();x.fillStyle='rgba(205,185,120,0.45)';for(const[a,b,r]of[[-.35,-.25,.22],[.3,.1,.17],[-.1,.4,.13],[.4,-.45,.1]]){x.beginPath();x.arc(mx+a*mr,my+b*mr,r*mr,0,7);x.fill();}
 for(let i=0;i<3;i++){const bx=((i*190-tt*(0.5+i*0.2)*0.8)%(W+80)+W+80)%(W+80)-40;bat(bx,my+30+i*34+Math.sin(tt*0.03+i)*10,0.55+i*0.08,tt*0.35+i*2,false);}
 x.fillStyle='#1d1136';x.beginPath();x.moveTo(0,G);for(let px=0;px<=W+6;px+=6){const u=px+sc*0.1;x.lineTo(px,G-32-Math.sin(u*0.011)*14-Math.sin(u*0.027+1)*8);}x.lineTo(W,G);x.fill();
 decor(0,G-4,'#150b27',0.25);
 fog(((tt*0.12)%(W+300))-150,G-6,170,0.2);fog(W-((tt*0.08)%(W+300))+150,G-12,150,0.16);
 x.fillStyle='#1b1228';x.fillRect(-10,G,W+20,H-G+10);x.fillStyle='#2b4a30';x.fillRect(-10,G,W+20,3);x.fillStyle='#3a6a3c';
 for(let i=0;i<40;i++){const px=(((i*37-sc)%(W+60))+W+60)%(W+60)-20;x.fillRect(px,G-2,2,3);x.fillRect(px+3,G-4,2,5);}
 x.fillStyle='#3a2a4e';for(let i=0;i<30;i++){const px=(((i*53-sc*1.0)%(W+60))+W+60)%(W+60)-20;x.fillRect(px,G+10+(i*7)%(H-G-14),3,2);}

 for(const o of obs){if(o.t==='pump')pump(o);else if(o.t==='tomb')tomb(o);else bat(o.x+15,o.y+8+Math.sin(tt*0.2+o.ph)*2,0.95,tt*0.45+o.ph,true);}

 if(state==='run')for(const p of pops){x.globalAlpha=1-p.l/40;x.fillStyle='#ffd23f';x.font='bold 15px '+FONT;x.textAlign='center';x.fillText('+50',p.x,p.y-p.l*0.9);}x.globalAlpha=1;

}
function overlay(){x.fillStyle='rgba(8,4,18,0.45)';x.fillRect(0,0,W,H);x.textAlign='center';const cy=Math.min(G*0.45,G-120);

 if(state==='ready'){x.fillStyle='#ff8a1f';x.font='bold 34px '+FONT;x.fillText('DINO RUSH',W/2,cy);x.fillStyle='#b98cff';x.font='bold 22px '+FONT;x.fillText('HALLOWEEN',W/2,cy+28);
  x.fillStyle='#fff';x.font='bold 17px '+FONT;x.fillText('TAP TO START',W/2,cy+66);x.fillStyle='#c9bde0';x.font='13px -apple-system,sans-serif';x.fillText(hint,W/2,cy+90);x.fillText('Grab candy corn, dodge pumpkins, graves & bats',W/2,cy+108);}
 else{x.fillStyle='#ff5a3c';x.font='bold 32px '+FONT;x.fillText('GAME OVER',W/2,cy);x.fillStyle='#fff';x.font='bold 20px '+FONT;x.fillText('Score '+Math.floor(score),W/2,cy+32);
  x.fillStyle=newBest?'#ffd23f':'#c9bde0';x.font='15px -apple-system,sans-serif';x.fillText(newBest?'NEW BEST!':'Best '+best,W/2,cy+55);
  x.fillStyle='#fff';x.font='bold 16px '+FONT;x.fillText('TAP TO TRY AGAIN',W/2,cy+88);}}
tt=0;let last=performance.now();
function frame(now){const dt=Math.min(2.5,Math.max(0,(now-last)/16.667));last=now;update(dt);draw();c.dataset.state=state;c.dataset.air=ground()?'0':'1';c.dataset.duck=ducking()?'1':'0';requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
