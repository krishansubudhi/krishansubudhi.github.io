<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e1116">
<link rel="manifest" href="/games/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/games/icons/icon-192.png">
<link rel="apple-touch-icon" href="/games/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/games/games.css">
<title>123</title>
<style>
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none;margin-bottom:8px}
.tabs button{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--dim);font-size:17px;font-weight:600}
.tabs button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
#q{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;margin:6px 0 12px;overflow:hidden}
#ask{font-size:21px;font-weight:700;margin-bottom:8px}
#pics{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:4px;font-size:44px;line-height:1.15;max-width:340px}
#pics .grp{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:150px}
#pics .op{font-size:40px;font-weight:800;color:var(--accent);align-self:center;padding:0 6px}
#sum{font-size:30px;font-weight:800;margin-top:8px;color:var(--ink)}
#hint{color:var(--dim);font-size:16px;min-height:22px;margin-top:6px}
#ch{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
#ch button{min-height:96px;border-radius:22px;border:2px solid var(--line);background:var(--card2);color:var(--ink);font-size:52px;font-weight:800;touch-action:manipulation}
#ch button.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
#ch button.no{background:var(--bad-bg);border-color:var(--bad)}
</style>
</head>
<body class="play">
<main>
<div class="top"><a class="back" href="/games/" aria-label="Back to games">‹</a><h1>🔢 123</h1><button id="mute" class="mute" aria-label="Sound on or off">🔊</button></div>
<div class="tabs"><button id="t1" class="on">Count</button><button id="t2">Add</button></div>
<div class="stats"><span>⭐ <b id="st">0</b></span><span>Best <b id="bs" style="color:var(--accent)">0</b> in a row</span></div>
<div class="card" id="q"><div id="ask">How many?</div><div id="pics"></div><div id="sum"></div><div id="hint">&nbsp;</div></div>
<div id="ch"></div>
</main>
<script>
// Gentle sounds via WebAudio, with a mute toggle shared by every game.
const SFX=(function(){let ac=null,muted=false;try{muted=localStorage.getItem('games.muted')==='1';}catch(e){}
const btn=document.getElementById('mute');function paint(){if(btn){btn.textContent=muted?'🔇':'🔊';btn.setAttribute('aria-pressed',muted?'true':'false');}}paint();
function tone(f,d,type,vol,slide){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
 const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
 g.gain.setValueAtTime(vol||0.06,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+0.02);}catch(e){}}
function notes(list,step,type){list.forEach((f,i)=>setTimeout(()=>tone(f,step*1.4,type),i*step*1000));}
if(btn)btn.addEventListener('click',()=>{muted=!muted;try{localStorage.setItem('games.muted',muted?'1':'0');}catch(e){}paint();if(muted&&window.speechSynthesis)try{speechSynthesis.cancel();}catch(e){}tone(660,0.08);});
return{tone,notes,get muted(){return muted;}};})();
</script>
<script>
(function(){
const THINGS=[['🍎','apples'],['⭐','stars'],['🐟','fish'],['🎈','balloons'],['🐥','chicks'],['🍓','strawberries'],['🚗','cars'],['🌸','flowers'],['🐞','ladybugs'],['🍪','cookies']];
const NAMES=['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
const CH=document.getElementById('ch'),PICS=document.getElementById('pics'),ASK=document.getElementById('ask'),SUM=document.getElementById('sum'),HINT=document.getElementById('hint'),ST=document.getElementById('st'),BS=document.getElementById('bs'),Q=document.getElementById('q');
let mode='count',stars=0,streak=0,ans=0,lock=false,prevKey='',best={count:0,add:0};
try{best.count=parseInt(localStorage.getItem('games.num.count.best'),10)||0;best.add=parseInt(localStorage.getItem('games.num.add.best'),10)||0;}catch(e){}
function speak(t){if(SFX.muted||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=0.85;u.pitch=1.15;u.lang='en-US';speechSynthesis.speak(u);}catch(e){}}
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function group(e,n){const g=document.createElement('div');g.className='grp';g.textContent=e.repeat(n);return g;}
function round(){lock=false;HINT.innerHTML='&nbsp;';SUM.textContent='';PICS.innerHTML='';const th=THINGS[rnd(0,THINGS.length-1)];let key;
 if(mode==='count'){do{ans=rnd(1,10);key='c'+ans;}while(key===prevKey);PICS.style.fontSize=ans>6?'38px':'48px';PICS.textContent=th[0].repeat(ans);ASK.textContent='How many '+th[1]+'?';speak('How many '+th[1]+'?');}
 else{let a,b;do{a=rnd(1,5);b=rnd(1,5);key=a+'+'+b;}while(key===prevKey);ans=a+b;PICS.style.fontSize=ans>7?'32px':'40px';
  PICS.appendChild(group(th[0],a));const op=document.createElement('div');op.className='op';op.textContent='+';PICS.appendChild(op);PICS.appendChild(group(th[0],b));
  SUM.textContent=a+' + '+b+' = ?';ASK.textContent='Add them up!';speak(NAMES[a]+' plus '+NAMES[b]);}
 prevKey=key;const max=mode==='count'?10:10,opts=[ans];while(opts.length<3){const k=ans+rnd(-3,3);if(k>=1&&k<=max&&!opts.includes(k))opts.push(k);}opts.sort((p,q)=>p-q);
 CH.innerHTML='';opts.forEach(k=>{const b=document.createElement('button');b.textContent=k;b.setAttribute('aria-label','Number '+k);b.onclick=()=>pick(b,k);CH.appendChild(b);});}
function pick(b,k){if(lock)return;
 if(k===ans){lock=true;b.classList.add('ok','pop');stars++;streak++;ST.textContent=stars;
  if(streak>best[mode]){best[mode]=streak;BS.textContent=streak;try{localStorage.setItem('games.num.'+mode+'.best',String(streak));}catch(e){}}
  if(mode==='add')SUM.textContent=SUM.textContent.replace('?',ans);HINT.textContent=['Great counting!','You got it!','Super!','Well done!'][stars%4];
  Q.classList.remove('pop');void Q.offsetWidth;Q.classList.add('pop');SFX.notes([523,659,784],0.09,'triangle');speak(NAMES[ans]+'! Great job!');setTimeout(round,1800);}
 else{streak=0;b.classList.add('no','shake');setTimeout(()=>b.classList.remove('shake'),350);SFX.tone(260,0.18,'sine',0.05,220);HINT.textContent='Not quite. Count again!';speak('Try again');}}
function setMode(m){mode=m;streak=0;document.getElementById('t1').classList.toggle('on',m==='count');document.getElementById('t2').classList.toggle('on',m==='add');BS.textContent=best[m];SFX.tone(600,0.06,'triangle');round();}
document.getElementById('t1').onclick=()=>setMode('count');document.getElementById('t2').onclick=()=>setMode('add');
BS.textContent=best.count;round();CH.dataset.ready='1';
})();
</script>
<script src="/games/register.js"></script>
</body>
</html>
