<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>(function(){function v(){var h=(window.visualViewport&&visualViewport.height)||innerHeight;document.documentElement.style.setProperty('--vh',h*0.01+'px');}v();addEventListener('resize',v);addEventListener('orientationchange',v);if(window.visualViewport)visualViewport.addEventListener('resize',v);})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e1116">
<link rel="manifest" href="/games/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/games/icons/icon-192.png">
<link rel="apple-touch-icon" href="/games/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/games/games.css">
<title>Angry Birds</title>
<style>
#area{flex:1;min-height:0;margin:8px 0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#g{display:block;background:var(--card2);border-radius:10px;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}
</style>
</head>
<body class="play">
<main>
<div class="top"><a class="back" href="/games/" aria-label="Back to games">‹</a><h1>🐷 Angry Birds</h1><button id="mute" class="mute" aria-label="Sound on or off">🔊</button></div>
<div class="stats"><span>Score <b id="s" style="color:var(--ink)">0</b></span><span>Best <b id="b" style="color:var(--accent)">0</b></span></div>
<div id="area"><canvas id="g"></canvas></div>
</main>
<script>
// Gentle sounds via WebAudio, with a mute toggle shared by every game.
const SFX=(function(){let ac=null,muted=false,unlocked=false;try{muted=localStorage.getItem('games.muted')==='1';}catch(e){}
const btn=document.getElementById('mute');function paint(){if(btn){btn.textContent=muted?'🔇':'🔊';btn.setAttribute('aria-pressed',muted?'true':'false');}}paint();
function ctx(){ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac;}
// iOS Safari only allows WebAudio/speech after a real user gesture. Unlock both
// the first time the player taps anywhere, so later automatic (setTimeout-driven)
// sounds and speech are allowed to play for the rest of the session.
function unlock(){if(unlocked)return;unlocked=true;
 try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
 try{const a=ctx(),b=a.createBuffer(1,1,22050),s=a.createBufferSource();s.buffer=b;s.connect(a.destination);s.start(0);}catch(e){}
 try{if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}}catch(e){}}
document.addEventListener('touchend',unlock,{once:true,passive:true});
document.addEventListener('click',unlock,{once:true});
function tone(f,d,type,vol,slide){if(muted)return;try{const a=ctx();
 const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
 g.gain.setValueAtTime(vol||0.06,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}catch(e){}}
function notes(list,step,type){list.forEach((f,i)=>setTimeout(()=>tone(f,step*1.4,type),i*step*1000));}
if(btn)btn.addEventListener('click',()=>{muted=!muted;try{localStorage.setItem('games.muted',muted?'1':'0');}catch(e){}paint();if(muted&&window.speechSynthesis)try{speechSynthesis.cancel();}catch(e){}tone(660,0.08);});
return{tone,notes,get muted(){return muted;}};})();
</script>
<script>
(function(){
const area=document.getElementById('area'),cv=document.getElementById('g'),x=cv.getContext('2d'),S=document.getElementById('s'),B=document.getElementById('b');
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#ccc';
const C={sky:css('--card2')||'#1f232c',gr:css('--line')||'#2c313c',ink:css('--ink')||'#eee',dim:css('--dim')||'#999',bird:css('--bad')||'#e5534b',pig:css('--ok')||'#4cc38a',wood:css('--warn')||'#e5a33d',acc:css('--accent')||'#7aa2ff'};
const KEY='games.angry.best';
let bestSaved=0;try{bestSaved=parseInt(localStorage.getItem(KEY),10)||0;}catch(e){}
let best=bestSaved;B.textContent=best;
function saveBest(){if(score>best){best=score;B.textContent=best;try{localStorage.setItem(KEY,String(best));}catch(e){}}}
// Logical coordinate space: fixed 360 wide (same as the original level
// layouts), height grows with however tall #area actually is (like Dino
// Run / Flappy), so a phone screen is used edge to edge and a short, wide
// desktop window gets clamped so the arc doesn't turn into a flat strip.
const W=360,GROUND_MARGIN=32,SLING_LIFT=68,DESIGN_G=268;
let H=300,G=268,SX=62,SY=200,scaleF=1,R=10,g=0.22,PW=0.13;
const MIN_AR=W/620,MAX_AR=W/230;
const LV=[
{b:[[235,228,12,40],[295,228,12,40],[229,216,84,12]],p:[[265,257],[271,205]]},
{b:[[220,218,12,50],[260,218,12,50],[300,218,12,50],[214,206,52,12],[266,206,52,12],[255,166,12,40],[235,154,52,12]],p:[[246,257],[286,257],[261,143]]},
{b:[[250,244,24,24],[250,220,24,24],[250,196,24,24],[300,208,12,60]],p:[[262,185],[325,257]]}];
let lvl=0,score=0,base=0,birds,bodies,bird,state,timer=0,parts=[],drag=false;
let lastHitT=0;
function hitSound(){const now=performance.now();if(now-lastHitT>90){lastHitT=now;SFX.tone(150,0.07,'square',0.045);}}
function size(){
 const DPR=Math.min(3,window.devicePixelRatio||1);
 let w=Math.max(1,area.clientWidth),h=Math.max(1,area.clientHeight);
 const ar=w/h;
 if(ar<MIN_AR)h=w/MIN_AR;else if(ar>MAX_AR)w=h*MAX_AR;
 scaleF=w/W;H=h/scaleF;G=H-GROUND_MARGIN;SY=G-SLING_LIFT;
 cv.style.width=Math.round(w)+'px';cv.style.height=Math.round(h)+'px';
 cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);
 x.setTransform(scaleF*DPR,0,0,scaleF*DPR,0,0);
}
function start(){base=score;const L=LV[lvl];const delta=G-DESIGN_G;
 bodies=L.b.map(a=>({x:a[0],y:a[1]+delta,w:a[2],h:a[3],vx:0,vy:0,hp:a[2]*a[3]/12,m:a[2]*a[3]/12,pig:0,aw:0,st:0}));
 L.p.forEach(p=>bodies.push({x:p[0]-11,y:p[1]-11+delta,w:22,h:22,vx:0,vy:0,hp:15,m:15,pig:1,aw:0,st:0}));
 birds=3;newBird();}
function newBird(){birds--;bird={x:SX,y:SY,vx:0,vy:0,fly:0,t:0,still:0};state='aim';}
function hurt(b,d){b.hp-=d;}
function pop(b){score+=b.pig?500:100;saveBest();
 if(b.pig)SFX.tone(880,0.14,'sine',0.055,1300);
 for(let i=0;i<10;i++)parts.push({x:b.x+b.w/2,y:b.y+b.h/2,vx:(Math.random()-.5)*5,vy:(Math.random()-.8)*5,l:30,c:b.pig?C.pig:C.wood});}
function supported(b){if(b.y+b.h>=G-1)return true;let lo=1e9,hi=-1e9;
 for(const o of bodies){if(o===b||Math.abs(o.y-(b.y+b.h))>=2)continue;const a=Math.max(o.x,b.x),z=Math.min(o.x+o.w,b.x+b.w);if(z-a>1){lo=Math.min(lo,a);hi=Math.max(hi,z);}}
 const cx=b.x+b.w/2;return cx>=lo-1&&cx<=hi+1;}
function coll(a,c){const ox=Math.min(a.x+a.w,c.x+c.w)-Math.max(a.x,c.x),oy=Math.min(a.y+a.h,c.y+c.h)-Math.max(a.y,c.y);
 if(ox<=0||oy<=0)return;
 if(oy<=ox){const t=a.y<c.y?a:c,b=t===a?c:a,rel=t.vy-b.vy;
  if(rel>2.5){hurt(t,(rel-2)*5);hurt(b,(rel-2)*5);b.aw=1;hitSound();}
  if(t.aw){t.y-=oy;t.vy=Math.min(t.vy,b.vy);t.vx*=0.85;}else{b.y+=oy;if(b.vy<0)b.vy=0;}
 }else{const l=a.x<c.x?a:c,r=l===a?c:a,rel=l.vx-r.vx;
  if(rel>1.5){hurt(l,(rel-1)*4);hurt(r,(rel-1)*4);l.aw=r.aw=1;hitSound();}
  if(l.aw&&r.aw){l.x-=ox/2;r.x+=ox/2;}else if(l.aw)l.x-=ox;else r.x+=ox;
  if(rel>0){const m=(l.vx+r.vx)/2*0.9;l.vx=m;r.vx=m;}}}
function hitBird(b){if(b.hp<=0)return;const cx=Math.max(b.x,Math.min(bird.x,b.x+b.w)),cy=Math.max(b.y,Math.min(bird.y,b.y+b.h));
 let dx=bird.x-cx,dy=bird.y-cy,d=Math.hypot(dx,dy);if(d>=R)return;
 const sp=Math.hypot(bird.vx,bird.vy);if(d<0.01){dx=-bird.vx;dy=-bird.vy;d=sp||1;}
 const nx=dx/d,ny=dy/d;
 if(sp>1.2){hurt(b,sp*6);b.aw=1;hitSound();const k=Math.min(1,300/(b.w*b.h));b.vx+=bird.vx*k*0.8;b.vy+=bird.vy*k*0.5;}
 if(b.hp<=0){bird.vx*=0.6;bird.vy*=0.6;return;}
 bird.x=cx+nx*R;bird.y=cy+ny*R;const vn=bird.vx*nx+bird.vy*ny;
 if(vn<0){bird.vx=(bird.vx-1.5*vn*nx)*0.7;bird.vy=(bird.vy-1.5*vn*ny)*0.7;}}
function step(h){
 if(bird&&bird.fly){bird.vy+=g*h;bird.x+=bird.vx*h;bird.y+=bird.vy*h;
  if(bird.y+R>G){bird.y=G-R;if(bird.vy>0)bird.vy*=-0.35;bird.vx*=0.85;}
  for(const b of bodies)hitBird(b);}
 for(const b of bodies){if(!b.aw)continue;b.vy+=g*h;b.x+=b.vx*h;b.y+=b.vy*h;
  if(b.y+b.h>G){if(b.vy>3)hurt(b,(b.vy-2)*8);b.y=G-b.h;b.vy=0;b.vx*=0.8;}}
 for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++){const a=bodies[i],c=bodies[j];if(a.aw||c.aw)coll(a,c);}
 for(const b of bodies){
  if(!b.aw){if(!supported(b)){b.aw=1;b.st=0;}}
  else if(Math.abs(b.vx)<0.08&&Math.abs(b.vy)<0.5&&supported(b)){if(++b.st>40){b.aw=0;b.vx=b.vy=0;}}else b.st=0;}
 bodies=bodies.filter(b=>{if(b.hp<=0||b.y>H||b.x>W+40||b.x+b.w<-40){pop(b);return false;}return true;});}
function drawBird(px,py,r){x.fillStyle=C.bird;x.beginPath();x.arc(px,py,r,0,7);x.fill();
 x.fillStyle=C.wood;x.beginPath();x.moveTo(px+r*.6,py-r*.1);x.lineTo(px+r*1.3,py+r*.15);x.lineTo(px+r*.6,py+r*.4);x.fill();
 x.fillStyle=C.ink;x.beginPath();x.arc(px+r*.3,py-r*.35,r*.28,0,7);x.fill();
 x.fillStyle=C.sky;x.beginPath();x.arc(px+r*.38,py-r*.35,r*.13,0,7);x.fill();}
function draw(){x.fillStyle=C.sky;x.fillRect(0,0,W,H);x.fillStyle=C.gr;x.fillRect(0,G,W,H-G);
 x.lineCap='round';x.strokeStyle=C.dim;x.lineWidth=5;x.beginPath();x.moveTo(SX,G);x.lineTo(SX,SY+18);x.lineTo(SX-9,SY);x.moveTo(SX,SY+18);x.lineTo(SX+9,SY);x.stroke();
 if(drag){let px=bird.x,py=bird.y,vx=-(bird.x-SX)*PW,vy=-(bird.y-SY)*PW;x.fillStyle=C.dim;
  for(let i=1;i<45;i++){vy+=g;px+=vx;py+=vy;if(py>G)break;if(i%3==0){x.beginPath();x.arc(px,py,1.8,0,7);x.fill();}}}
 if(state==='aim'){x.strokeStyle=C.wood;x.lineWidth=3;x.beginPath();x.moveTo(SX-9,SY);x.lineTo(bird.x,bird.y);x.moveTo(SX+9,SY);x.lineTo(bird.x,bird.y);x.stroke();}
 for(const b of bodies){if(b.pig){const cx=b.x+11,cy=b.y+11;x.fillStyle=C.pig;x.beginPath();x.arc(cx,cy,11,0,7);x.fill();
   x.fillStyle=C.ink;x.beginPath();x.arc(cx-4,cy-3,2.6,0,7);x.arc(cx+4,cy-3,2.6,0,7);x.fill();
   x.globalAlpha=.35;x.fillStyle=C.sky;x.beginPath();x.ellipse(cx,cy+4,4.5,3,0,0,7);x.fill();x.globalAlpha=1;}
  else{x.fillStyle=C.wood;x.fillRect(b.x,b.y,b.w,b.h);x.globalAlpha=.35;x.strokeStyle=C.sky;x.lineWidth=1.5;x.strokeRect(b.x+.75,b.y+.75,b.w-1.5,b.h-1.5);
   if(b.hp<b.m*.6){x.beginPath();x.moveTo(b.x+b.w*.3,b.y);x.lineTo(b.x+b.w*.55,b.y+b.h*.5);x.lineTo(b.x+b.w*.4,b.y+b.h);x.stroke();}x.globalAlpha=1;}}
 for(let i=0;i<birds;i++)drawBird(18+i*17,G-7,7);
 if(bird)drawBird(bird.x,bird.y,R);
 for(const p of parts){x.globalAlpha=p.l/30;x.fillStyle=p.c;x.fillRect(p.x-2,p.y-2,4,4);}x.globalAlpha=1;
 x.textAlign='left';x.fillStyle=C.dim;x.font='13px -apple-system,sans-serif';x.fillText('Level '+(lvl+1)+'/3',10,18);
 if(state==='win'||state==='lose'||state==='done'){x.globalAlpha=.85;x.fillStyle=C.sky;x.fillRect(0,0,W,H);x.globalAlpha=1;x.textAlign='center';
  x.fillStyle=state==='lose'?C.bird:C.pig;x.font='bold 26px system-ui';
  x.fillText(state==='win'?'Level cleared!':state==='lose'?'The pigs win':'You beat all 3!',W/2,H/2-14);
  x.fillStyle=C.ink;x.font='16px system-ui';x.fillText(score+' points',W/2,H/2+14);
  x.fillStyle=C.dim;x.font='14px system-ui';x.fillText(state==='win'?'Tap for the next level':state==='lose'?'Tap to retry':'Tap to play again',W/2,H/2+40);}
 S.textContent=score;}
function frame(){
 if(state==='aim'||state==='fly'||state==='wait'){step(.5);step(.5);}
 if(bird&&bird.fly){bird.t++;if(Math.hypot(bird.vx,bird.vy)<0.2)bird.still++;else bird.still=0;
  if(bird.still>30||bird.x>W+30||bird.x<-30||bird.t>480){bird=null;state='wait';timer=70;}}
 if(state==='wait'&&--timer<=0){if(!bodies.some(b=>b.pig)){score+=birds*1000;saveBest();state='win';SFX.notes([523,659,784],0.11,'triangle');}else if(birds>0)newBird();else{state='lose';SFX.notes([392,330,262],0.13,'triangle');}}
 for(const p of parts){p.vy+=.2;p.x+=p.vx;p.y+=p.vy;p.l--;}parts=parts.filter(p=>p.l>0);
 draw();requestAnimationFrame(frame);}
function pt(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];}
function move(px,py){let dx=px-SX,dy=py-SY,l=Math.hypot(dx,dy);if(l>70){dx*=70/l;dy*=70/l;}bird.x=SX+dx;bird.y=SY+dy;}
cv.onpointerdown=e=>{e.preventDefault();const[px,py]=pt(e);
 if(state==='win'){lvl++;if(lvl>=LV.length){state='done';return;}start();return;}
 if(state==='done'){lvl=0;score=0;start();return;}
 if(state==='lose'){score=base;start();return;}
 if(state==='aim'&&Math.hypot(px-bird.x,py-bird.y)<45){drag=true;cv.setPointerCapture(e.pointerId);move(px,py);}};
cv.onpointermove=e=>{if(drag){e.preventDefault();const[px,py]=pt(e);move(px,py);}};
cv.onpointerup=cv.onpointercancel=()=>{if(!drag)return;drag=false;const dx=bird.x-SX,dy=bird.y-SY;
 if(Math.hypot(dx,dy)<12){bird.x=SX;bird.y=SY;return;}bird.vx=-dx*PW;bird.vy=-dy*PW;bird.fly=1;state='fly';
 SFX.tone(220,0.16,'sawtooth',0.05,80);};
addEventListener('resize',size);addEventListener('orientationchange',size);
size();start();frame();
window.__angryLaunch=(dx,dy)=>{if(state!=='aim')return;drag=true;move(bird.x+dx===bird.x?SX-dx:SX-dx,SY-dy);bird.x=SX-dx;bird.y=SY-dy;drag=false;bird.vx=-(bird.x-SX)*PW;bird.vy=-(bird.y-SY)*PW;bird.fly=1;state='fly';SFX.tone(220,0.16,'sawtooth',0.05,80);}; // exposed for automated verification only
window.__angryState=()=>({state,lvl,score,best,birds,bodies:bodies.map(b=>({x:b.x,y:b.y,w:b.w,h:b.h,pig:b.pig,hp:b.hp})),bird:bird?{x:bird.x,y:bird.y,fly:bird.fly}:null}); // exposed for automated verification only
})();
</script>
<script src="/games/register.js"></script>
</body>
