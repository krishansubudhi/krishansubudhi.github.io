<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>(function(){function v(){var h=(window.visualViewport&&visualViewport.height)||innerHeight;document.documentElement.style.setProperty('--vh',h*0.01+'px');}v();addEventListener('resize',v);addEventListener('orientationchange',v);if(window.visualViewport)visualViewport.addEventListener('resize',v);})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e1116">
<link rel="manifest" href="/games/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/games/icons/icon-192.png">
<link rel="apple-touch-icon" href="/games/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/games/games.css">
<title>Pumpkin Catch</title>
<style>
.top h1{font-size:21px;white-space:nowrap}
#area{flex:1;min-height:0;margin:8px 0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
#g{display:block;background:#180b30;border-radius:14px;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
@media (max-width:340px),(max-height:360px){
 body.play{padding:6px 8px}
 body.play .top{margin:0 0 4px;gap:6px}
 body.play .top h1{font-size:15px}
 body.play .back,body.play .mute{min-width:34px;height:34px;font-size:16px;border-radius:8px}
 body.play .stats{font-size:13px}
 #area{margin:4px 0}
}
</style>
</head>
<body class="play">
<main>
<div class="top"><a class="back" href="/games/" aria-label="Back to games">‹</a><h1>🎃 Pumpkin Catch</h1><button id="mute" class="mute" aria-label="Sound on or off">🔊</button></div>
<div class="stats"><span>🎃 <b id="s" style="color:var(--ink)">0</b></span><span><b id="lf" aria-label="Lives">❤️❤️❤️</b></span><span>🏆 <b id="b" style="color:var(--accent)">0</b></span></div>
<div id="area"><canvas id="g" aria-label="Pumpkin Catch. Touch or drag to move the basket, catch pumpkins, dodge bats."></canvas></div>
</main>
<script>
// Gentle sounds via WebAudio, with a mute toggle shared by every game.
const SFX=(function(){let ac=null,muted=false,unlocked=false;try{muted=localStorage.getItem('games.muted')==='1';}catch(e){}
const btn=document.getElementById('mute');function paint(){if(btn){btn.textContent=muted?'🔇':'🔊';btn.setAttribute('aria-pressed',muted?'true':'false');}}paint();
function ctx(){ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac;}
function unlock(){if(unlocked)return;unlocked=true;
 try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
 try{const a=ctx(),b=a.createBuffer(1,1,22050),s=a.createBufferSource();s.buffer=b;s.connect(a.destination);s.start(0);}catch(e){}}
document.addEventListener('touchend',unlock,{once:true,passive:true});
document.addEventListener('click',unlock,{once:true});
function tone(f,d,type,vol,slide){if(muted)return;try{const a=ctx();
 const t=a.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
 g.gain.setValueAtTime(vol||0.06,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}catch(e){}}
function notes(list,step,type){list.forEach((f,i)=>setTimeout(()=>tone(f,step*1.4,type),i*step*1000));}
if(btn)btn.addEventListener('click',()=>{muted=!muted;try{localStorage.setItem('games.muted',muted?'1':'0');}catch(e){}paint();tone(660,0.08);});
return{tone,notes,get muted(){return muted;}};})();
</script>
<script>
(function(){
const area=document.getElementById('area'),c=document.getElementById('g'),x=c.getContext('2d');
const S=document.getElementById('s'),LF=document.getElementById('lf'),B=document.getElementById('b');
const KEY='games.pumpkin.best';
let best=0;try{best=parseInt(localStorage.getItem(KEY),10)||0;}catch(e){}B.textContent=best;
const W0=360,HFLOOR=220,MIN_AR=W0/720,MAX_AR=W0/HFLOOR;
const BW=86,BH=38,PR=22,BR=18;
let W=W0,H=460,scaleF=1,stars=[];
let bx=W0/2,tx=W0/2,by=400,items=[],parts=[],pops=[],score=0,lives=3,speed=115,spawnT=0,spawns=0,inv=0,shake=0,tt=0,overAt=0,newBest=false,state='ready';
function clampX(v){const pad=BW*0.5+10;return Math.min(W-pad,Math.max(pad,v));}
function size(){
 const R=Math.min(3,window.devicePixelRatio||1);
 let w=Math.max(1,area.clientWidth),h=Math.max(1,area.clientHeight);
 const ar=w/h;
 if(ar<MIN_AR){h=w/MIN_AR;scaleF=w/W0;W=W0;H=h/scaleF;}
 else if(ar>MAX_AR){H=HFLOOR;scaleF=h/H;W=w/scaleF;}
 else{scaleF=w/W0;W=W0;H=h/scaleF;}
 by=H-36;bx=clampX(bx);tx=clampX(tx);
 c.style.width=Math.round(w)+'px';c.style.height=Math.round(h)+'px';
 c.width=Math.round(w*R);c.height=Math.round(h*R);
 x.setTransform(scaleF*R,0,0,scaleF*R,0,0);
 stars=[];let s=11;for(let i=0;i<36;i++){s=(s*9301+49297)%233280;const a=s/233280;s=(s*9301+49297)%233280;const b=s/233280;stars.push({x:a*W,y:b*(H-60),r:1+(i%3)*0.7,p:i*1.3});}
}
function hud(){S.textContent=score;LF.textContent='❤️'.repeat(Math.max(0,lives))+'🖤'.repeat(Math.max(0,3-lives));}
function reset(){bx=W/2;tx=W/2;items=[];parts=[];pops=[];score=0;lives=3;speed=115;spawnT=0.25;spawns=0;inv=0;shake=0;newBest=false;hud();}
size();reset();
function begin(px){reset();if(typeof px==='number')bx=tx=clampX(px);state='run';SFX.notes([392,523,659],0.07,'triangle');}
function relX(e){const r=c.getBoundingClientRect();return (e.clientX-r.left)/scaleF;}
let ptrId=null;
area.addEventListener('pointerdown',e=>{
 e.preventDefault();const px=relX(e);
 ptrId=e.pointerId;try{area.setPointerCapture(e.pointerId);}catch(_){}
 if(state==='ready'){begin(px);return;}
 if(state==='over'){if(performance.now()-overAt>400)begin(px);return;}
 tx=clampX(px);
});
area.addEventListener('pointermove',e=>{
 if(state!=='run')return;
 if(ptrId===e.pointerId||e.pointerType==='mouse'||e.buttons>0)tx=clampX(relX(e));
});
function endPtr(e){if(ptrId===e.pointerId)ptrId=null;}
area.addEventListener('pointerup',endPtr);area.addEventListener('pointercancel',endPtr);
area.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
area.addEventListener('contextmenu',e=>e.preventDefault());
const keys={};
addEventListener('keydown',e=>{
 if(e.target&&e.target.closest&&e.target.closest('a,#mute'))return;
 const L=e.code==='ArrowLeft'||e.code==='KeyA',R=e.code==='ArrowRight'||e.code==='KeyD',GO=e.code==='Space'||e.code==='Enter';
 if(L||R||GO){e.preventDefault();if(state==='ready')begin();else if(state==='over'&&performance.now()-overAt>400)begin();}
 if(L)keys.L=1;if(R)keys.R=1;
});
addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.L=0;if(e.code==='ArrowRight'||e.code==='KeyD')keys.R=0;});
addEventListener('resize',size);addEventListener('orientationchange',size);
function spawn(){
 spawns++;
 const margin=36,isBat=spawns>2&&Math.random()<Math.min(0.32,0.22+score*0.003);
 let sx=margin+Math.random()*(W-margin*2);
 if(isBat){
  for(let k=0;k<6;k++){if(!items.some(it=>it.t==='pump'&&it.y<90&&Math.abs(it.x-sx)<76))break;sx=margin+Math.random()*(W-margin*2);}
 }
 items.push({t:isBat?'bat':'pump',x:sx,y:-26,vx:(Math.random()-0.5)*(isBat?28:10),ph:Math.random()*6.28});
}
function burst(px,py,col,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=50+Math.random()*110;parts.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v-20,l:0.45+Math.random()*0.25,col,r:2.5+Math.random()*2.5});}}
function step(dt){
 tt+=dt;
 parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=180*dt;p.l-=dt;});parts=parts.filter(p=>p.l>0);
 pops.forEach(p=>{p.y-=42*dt;p.l-=dt;});pops=pops.filter(p=>p.l>0);
 if(shake>0)shake=Math.max(0,shake-dt*30);
 if(state!=='run')return;
 const kd=(keys.R?1:0)-(keys.L?1:0);if(kd)tx=clampX(tx+kd*320*dt);
 bx+=(tx-bx)*Math.min(1,dt*20);
 if(inv>0)inv=Math.max(0,inv-dt);
 speed=Math.min(250,115+score*3.2);
 spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(0.46,0.92-score*0.01)+(Math.random()*0.18);}
 for(const it of items){
  it.y+=(speed+(it.t==='bat'?18:0))*dt;
  it.x+=it.vx*dt+(it.t==='bat'?Math.sin(tt*5+it.ph)*36*dt:0);
  if(it.x<28){it.x=28;it.vx=Math.abs(it.vx);}else if(it.x>W-28){it.x=W-28;it.vx=-Math.abs(it.vx);}
  if(it.got)continue;
  const dy=it.y-by,dx=Math.abs(it.x-bx);
  if(it.t==='pump'){
   if(dy>-BH*0.65&&dy<BH*0.55&&dx<BW*0.5+10){
    it.got=1;score++;hud();burst(it.x,by-8,'#ffb703',14);burst(it.x,by-8,'#ff6d00',8);
    pops.push({x:it.x,y:by-18,l:0.65,txt:'+1',col:'#ffe066'});
    SFX.notes([523,659],0.06,'triangle');
   }
  }else if(inv<=0&&dy>-BH*0.42&&dy<BH*0.38&&dx<BW*0.42){
   it.got=1;lives--;hud();inv=1.0;shake=10;burst(it.x,by,'#ff4d6d',18);
   pops.push({x:it.x,y:by-18,l:0.7,txt:'💔',col:'#ff6b8b'});
   SFX.tone(210,0.22,'sawtooth',0.06,120);
   if(lives<=0){
    state='over';overAt=performance.now();SFX.notes([392,330,262,196],0.12,'triangle');
    if(score>best){best=score;newBest=true;B.textContent=best;try{localStorage.setItem(KEY,String(best));}catch(e){}}
   }
  }
 }
 items=items.filter(it=>!it.got&&it.y<H+40);
}
function drawPumpkin(px,py,r,wob){
 x.save();x.translate(px,py);if(wob)x.rotate(Math.sin(wob)*0.08);
 x.fillStyle='rgba(255,145,0,0.22)';x.beginPath();x.arc(0,0,r*1.35,0,7);x.fill();
 x.fillStyle='#ff6d00';x.beginPath();x.ellipse(0,2,r,r*0.86,0,0,7);x.fill();
 x.fillStyle='#ff8500';x.beginPath();x.ellipse(-r*0.38,2,r*0.48,r*0.84,0,0,7);x.ellipse(r*0.38,2,r*0.48,r*0.84,0,0,7);x.fill();
 x.fillStyle='#ff9e00';x.beginPath();x.ellipse(0,2,r*0.45,r*0.86,0,0,7);x.fill();
 x.fillStyle='#38b000';x.beginPath();x.roundRect(-3.5,-r*0.95,7,r*0.32,3);x.fill();
 x.fillStyle='#ffe066';
 x.beginPath();x.moveTo(-r*0.48,-1);x.lineTo(-r*0.16,-1);x.lineTo(-r*0.32,-r*0.42);x.closePath();
 x.moveTo(r*0.16,-1);x.lineTo(r*0.48,-1);x.lineTo(r*0.32,-r*0.42);x.closePath();x.fill();
 x.beginPath();x.arc(0,r*0.12,r*0.48,0.15,Math.PI-0.15);x.fill();
 x.restore();
}
function drawBat(px,py,r,ph){
 const flap=Math.sin(ph)*0.65;
 x.save();x.translate(px,py);
 x.fillStyle='rgba(180,90,255,0.2)';x.beginPath();x.arc(0,0,r*1.35,0,7);x.fill();
 x.fillStyle='#3c096c';x.strokeStyle='#c77dff';x.lineWidth=2;
 for(const q of[-1,1]){
  x.beginPath();x.moveTo(q*4,0);
  x.quadraticCurveTo(q*r*0.9,-r*(0.9+flap*0.7),q*r*1.45,-r*0.2+flap*r*0.5);
  x.quadraticCurveTo(q*r*1.0,r*0.35,q*r*0.65,r*0.15);
  x.quadraticCurveTo(q*r*0.35,r*0.45,q*4,r*0.25);
  x.closePath();x.fill();x.stroke();
 }
 x.fillStyle='#240046';x.beginPath();x.arc(0,2,r*0.48,0,7);x.fill();
 x.beginPath();x.moveTo(-6,-4);x.lineTo(-4,-13);x.lineTo(-1,-6);x.moveTo(6,-4);x.lineTo(4,-13);x.lineTo(1,-6);x.fill();
 x.fillStyle='#ff4d6d';x.beginPath();x.arc(-3.2,0,2.4,0,7);x.arc(3.2,0,2.4,0,7);x.fill();
 x.restore();
}
function drawBasket(){
 if(inv>0&&Math.floor(inv*12)%2)x.globalAlpha=0.55;
 x.save();x.translate(bx,by);
 const hw=BW/2,hh=BH/2;
 x.strokeStyle='#ffb703';x.lineWidth=4.5;x.beginPath();x.arc(0,-4,hw*0.78,Math.PI+0.15,-0.15);x.stroke();
 const nShow=Math.min(4,score);
 for(let i=0;i<nShow;i++){const ox=(i-(nShow-1)/2)*15;x.fillStyle='#ff9e00';x.beginPath();x.arc(ox,-hh+3,9,0,7);x.fill();}
 x.fillStyle='#e85d04';x.beginPath();x.moveTo(-hw,-hh+4);x.lineTo(hw,-hh+4);x.lineTo(hw*0.78,hh);x.lineTo(-hw*0.78,hh);x.closePath();x.fill();
 x.strokeStyle='#9d0208';x.lineWidth=2.5;
 for(let i=-2;i<=2;i++){x.beginPath();x.moveTo(i*14,-hh+6);x.lineTo(i*11,hh-2);x.stroke();}
 x.beginPath();x.moveTo(-hw*0.88,2);x.lineTo(hw*0.88,2);x.stroke();
 x.fillStyle='#ffb703';x.beginPath();x.roundRect(-hw-3,-hh,BW+6,9,5);x.fill();
 x.fillStyle='#ffe066';x.beginPath();x.arc(-7,4,2.2,0,7);x.arc(7,4,2.2,0,7);x.fill();
 x.strokeStyle='#ffe066';x.lineWidth=2.2;x.beginPath();x.arc(0,5,6,0.2,Math.PI-0.2);x.stroke();
 x.restore();x.globalAlpha=1;
}
function draw(){
 x.save();if(shake>0)x.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
 const sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#120724');sky.addColorStop(0.55,'#2b1055');sky.addColorStop(1,'#5a189a');
 x.fillStyle=sky;x.fillRect(-12,-12,W+24,H+24);
 for(const s of stars){x.globalAlpha=0.45+0.5*Math.sin(tt*2.2+s.p);x.fillStyle='#fff3b0';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill();}x.globalAlpha=1;
 const mr=Math.min(34,H*0.1),mx=W-54,my=Math.min(54,H*0.18);
 x.fillStyle='rgba(255,230,128,0.22)';x.beginPath();x.arc(mx,my,mr*1.7,0,7);x.fill();
 x.fillStyle='#ffe885';x.beginPath();x.arc(mx,my,mr,0,7);x.fill();
 x.fillStyle='#1d0a38';x.beginPath();x.moveTo(0,H);x.quadraticCurveTo(W*0.28,H-42,W*0.55,H-22);x.quadraticCurveTo(W*0.82,H-4,W,H-34);x.lineTo(W,H);x.closePath();x.fill();
 x.fillStyle='#110521';x.fillRect(0,H-16,W,20);
 for(const it of items){if(it.t==='pump')drawPumpkin(it.x,it.y,PR,tt*3+it.ph);else drawBat(it.x,it.y,BR,tt*11+it.ph);}
 drawBasket();
 for(const p of parts){x.globalAlpha=Math.max(0,Math.min(1,p.l*2.2));x.fillStyle=p.col;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();}
 for(const p of pops){x.globalAlpha=Math.max(0,Math.min(1,p.l*2));x.fillStyle=p.col;x.font='bold 22px system-ui,sans-serif';x.textAlign='center';x.fillText(p.txt,p.x,p.y);}
 x.globalAlpha=1;x.restore();
 if(state!=='run'){
  x.fillStyle='rgba(14,6,28,0.72)';x.fillRect(0,0,W,H);
  const cy=H*0.46;x.textAlign='center';
  if(state==='ready'){
   drawPumpkin(W/2-48,cy-48,22,tt*3);drawBat(W/2+48,cy-48,18,tt*9);
   x.font='bold 20px system-ui,sans-serif';x.fillStyle='#5fd97f';x.fillText('+1',W/2-48,cy-8);
   x.fillStyle='#ff8b82';x.fillText('−❤️',W/2+48,cy-8);
   x.fillStyle='#ff9e00';x.beginPath();x.roundRect(W/2-88,cy+14,176,54,27);x.fill();
   x.fillStyle='#120724';x.font='bold 24px system-ui,sans-serif';x.fillText('▶ TAP',W/2,cy+49);
  }else{
   x.font='bold 34px system-ui,sans-serif';x.fillStyle='#ffe066';x.fillText('🎃 '+score,W/2,cy-38);
   x.font='bold 20px system-ui,sans-serif';x.fillStyle=newBest?'#5fd97f':'#e0aaff';
   x.fillText((newBest?'⭐ ':'🏆 ')+best,W/2,cy-4);
   x.fillStyle='#ff9e00';x.beginPath();x.roundRect(W/2-88,cy+18,176,54,27);x.fill();
   x.fillStyle='#120724';x.font='bold 24px system-ui,sans-serif';x.fillText('▶ AGAIN',W/2,cy+53);
  }
 }
}
let last=performance.now();
function frame(now){const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;step(dt);draw();c.dataset.state=state;requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
<script src="/games/register.js"></script>
</body>
</html>
